<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">Missing evidence belongs in the record</title><desc id="desc">A Drivable educational card encouraging honest unknown and unavailable labels instead of invented certainty.</desc>
  <rect width="1080" height="1350" fill="#F7F9FB"/><rect x="0" width="28" height="1350" fill="#FF8F8F"/><g font-family="Inter,Arial,sans-serif"><text x="86" y="100" fill="#106B85" font-size="28" font-weight="850" letter-spacing="2">DRIVABLE CHECK · EVIDENCE 04</text><text x="86" y="238" fill="#172334" font-size="72" font-weight="850">Missing evidence</text><text x="86" y="323" fill="#172334" font-size="72" font-weight="850">belongs in the record.</text><text x="86" y="390" fill="#52677F" font-size="27">“I don't know” is more useful than invented certainty.</text>
  <g transform="translate(86 472)"><rect width="908" height="148" rx="24" fill="#FFFFFF" stroke="#C9D6E4" stroke-width="2"/><rect x="28" y="30" width="176" height="38" rx="19" fill="#FFD7D7"/><text x="116" y="56" text-anchor="middle" fill="#6D2424" font-size="16" font-weight="850">NOT AVAILABLE</text><text x="28" y="112" fill="#172334" font-size="25" font-weight="750">No maintenance record was available.</text></g>
  <g transform="translate(86 646)"><rect width="908" height="148" rx="24" fill="#FFFFFF" stroke="#C9D6E4" stroke-width="2"/><rect x="28" y="30" width="134" height="38" rx="19" fill="#FFF2D1"/><text x="95" y="56" text-anchor="middle" fill="#604713" font-size="16" font-weight="850">NOT SURE</text><text x="28" y="112" fill="#172334" font-size="25" font-weight="750">The exact dashboard message was not remembered.</text></g>
  <g transform="translate(86 820)"><rect width="908" height="148" rx="24" fill="#FFFFFF" stroke="#C9D6E4" stroke-width="2"/><rect x="28" y="30" width="190" height="38" rx="19" fill="#E7EDF3"/><text x="123" y="56" text-anchor="middle" fill="#3A4D61" font-size="16" font-weight="850">NOT OBSERVED</text><text x="28" y="112" fill="#172334" font-size="25" font-weight="750">The symptom did not repeat while safely parked.</text></g>
  <rect x="86" y="1032" width="908" height="112" rx="22" fill="#11283B"/><text x="540" y="1076" text-anchor="middle" fill="#EDF5FF" font-size="23" font-weight="900">MISSING DOES NOT MEAN “NO PROBLEM”</text><text x="540" y="1111" text-anchor="middle" fill="#B8C9DA" font-size="20">It means the evidence does not answer that question yet.</text><text x="86" y="1278" fill="#172334" font-size="38" font-weight="850">Drivable</text><text x="260" y="1278" fill="#52677F" font-size="21">by Mechanic's Eye</text><text x="994" y="1278" text-anchor="end" fill="#52677F" font-size="19">Educational card · not a safety clearance</text></g>
</svg>
