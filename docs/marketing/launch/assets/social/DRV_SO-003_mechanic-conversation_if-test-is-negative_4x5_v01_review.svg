<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">Ask what happens if the first test is negative</title><desc id="desc">A respectful mechanic-conversation card encouraging customers to understand the decision path before authorizing additional work.</desc>
  <rect width="1080" height="1350" fill="#EAF2F8"/><g font-family="Inter,Arial,sans-serif"><text x="84" y="102" fill="#106B85" font-size="27" font-weight="850" letter-spacing="2">BETTER MECHANIC CONVERSATIONS · 04</text><text x="84" y="235" fill="#172334" font-size="68" font-weight="850">Ask what happens if</text><text x="84" y="317" fill="#172334" font-size="68" font-weight="850">the first test is negative.</text>
  <path d="M160 465H920" stroke="#B9CAD9" stroke-width="8" stroke-linecap="round"/><circle cx="160" cy="465" r="34" fill="#3BD6FF"/><circle cx="540" cy="465" r="34" fill="#FFD27D"/><circle cx="920" cy="465" r="34" fill="#FF8F8F"/><text x="160" y="473" text-anchor="middle" fill="#07111F" font-size="23" font-weight="900">1</text><text x="540" y="473" text-anchor="middle" fill="#07111F" font-size="23" font-weight="900">2</text><text x="920" y="473" text-anchor="middle" fill="#07111F" font-size="23" font-weight="900">3</text>
  <text x="160" y="540" text-anchor="middle" fill="#172334" font-size="23" font-weight="850">FIRST TEST</text><text x="540" y="540" text-anchor="middle" fill="#172334" font-size="23" font-weight="850">NEXT EVIDENCE</text><text x="920" y="540" text-anchor="middle" fill="#172334" font-size="23" font-weight="850">DECISION POINT</text>
  <rect x="84" y="620" width="912" height="228" rx="28" fill="#FFFFFF" stroke="#C9D6E4" stroke-width="2"/><text x="124" y="688" fill="#172334" font-size="28" font-weight="850">Try asking:</text><text x="124" y="751" fill="#172334" font-size="31" font-weight="750">“If this test does not support the suspected cause,</text><text x="124" y="796" fill="#172334" font-size="31" font-weight="750">what would you check next—and before what work?”</text>
  <text x="84" y="940" fill="#52677F" font-size="27">A clear path helps you understand when more testing,</text><text x="84" y="982" fill="#52677F" font-size="27">authorization, time, or cost may be needed.</text>
  <rect x="84" y="1060" width="912" height="92" rx="22" fill="#0B344B"/><text x="540" y="1117" text-anchor="middle" fill="#FFFFFF" font-size="23" font-weight="900">AGREE ON AUTHORIZATION LIMITS BEFORE WORK CHANGES</text><text x="84" y="1276" fill="#172334" font-size="38" font-weight="850">Drivable</text><text x="260" y="1276" fill="#52677F" font-size="21">by Mechanic's Eye</text><text x="996" y="1276" text-anchor="end" fill="#52677F" font-size="19">Educational card · not repair advice</text></g>
</svg>
