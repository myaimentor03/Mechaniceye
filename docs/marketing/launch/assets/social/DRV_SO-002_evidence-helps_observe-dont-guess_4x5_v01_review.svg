<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">Observe, don't guess — Drivable educational social card</title>
  <desc id="desc">A dark editorial card explaining four useful vehicle observations and reminding users never to collect evidence while driving.</desc>
  <rect width="1080" height="1350" fill="#07111F"/>
  <circle cx="970" cy="115" r="245" fill="#0D1A2B"/>
  <path d="M0 1080 C260 980 410 1135 650 1060 S940 940 1080 1005 V1350 H0Z" fill="#0D1A2B"/>
  <g font-family="Inter,Arial,sans-serif">
    <text x="84" y="90" font-size="30" font-weight="700" letter-spacing="2" fill="#3BD6FF">DRIVABLE CHECK · EVIDENCE 01</text>
    <text x="84" y="205" font-size="82" font-weight="750" fill="#EDF5FF">Observe.</text>
    <text x="84" y="295" font-size="82" font-weight="750" fill="#EDF5FF">Don't guess.</text>
    <text x="84" y="365" font-size="30" fill="#9CB0C8">A useful vehicle note starts with what changed.</text>
    <g transform="translate(84 450)">
      <rect width="912" height="128" rx="24" fill="#122238" stroke="#223854" stroke-width="2"/>
      <circle cx="66" cy="64" r="28" fill="#3BD6FF"/><text x="66" y="74" font-size="28" font-weight="800" text-anchor="middle" fill="#07111F">1</text>
      <text x="120" y="55" font-size="29" font-weight="700" fill="#EDF5FF">When does it happen?</text><text x="120" y="91" font-size="24" fill="#9CB0C8">Starting, braking, turning, idling, or at speed?</text>
    </g>
    <g transform="translate(84 600)">
      <rect width="912" height="128" rx="24" fill="#122238" stroke="#223854" stroke-width="2"/>
      <circle cx="66" cy="64" r="28" fill="#3BD6FF"/><text x="66" y="74" font-size="28" font-weight="800" text-anchor="middle" fill="#07111F">2</text>
      <text x="120" y="55" font-size="29" font-weight="700" fill="#EDF5FF">What can you safely notice?</text><text x="120" y="91" font-size="24" fill="#9CB0C8">A sound, smell, warning message, leak, or vibration.</text>
    </g>
    <g transform="translate(84 750)">
      <rect width="912" height="128" rx="24" fill="#122238" stroke="#223854" stroke-width="2"/>
      <circle cx="66" cy="64" r="28" fill="#3BD6FF"/><text x="66" y="74" font-size="28" font-weight="800" text-anchor="middle" fill="#07111F">3</text>
      <text x="120" y="55" font-size="29" font-weight="700" fill="#EDF5FF">What changed recently?</text><text x="120" y="91" font-size="24" fill="#9CB0C8">Weather, fuel, service, impact, load, or driving pattern.</text>
    </g>
    <g transform="translate(84 900)">
      <rect width="912" height="128" rx="24" fill="#122238" stroke="#223854" stroke-width="2"/>
      <circle cx="66" cy="64" r="28" fill="#FFD27D"/><text x="66" y="74" font-size="28" font-weight="800" text-anchor="middle" fill="#07111F">?</text>
      <text x="120" y="55" font-size="29" font-weight="700" fill="#EDF5FF">What is still unknown?</text><text x="120" y="91" font-size="24" fill="#9CB0C8">An honest unknown is better than invented certainty.</text>
    </g>
    <rect x="84" y="1100" width="912" height="94" rx="18" fill="#FFD27D"/>
    <text x="540" y="1140" font-size="24" font-weight="800" text-anchor="middle" fill="#07111F">PARK FIRST. EVIDENCE SECOND.</text>
    <text x="540" y="1173" font-size="21" text-anchor="middle" fill="#07111F">Never record, type, photograph, or connect equipment while driving.</text>
    <text x="84" y="1283" font-size="38" font-weight="800" fill="#EDF5FF">drivable</text>
    <text x="258" y="1283" font-size="21" fill="#9CB0C8">by Mechanic's Eye</text>
    <text x="996" y="1283" font-size="20" text-anchor="end" fill="#9CB0C8">Educational card · not a diagnosis</text>
  </g>
</svg>
