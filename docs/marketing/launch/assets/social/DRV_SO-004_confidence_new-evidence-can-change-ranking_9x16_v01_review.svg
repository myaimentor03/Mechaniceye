<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-labelledby="title desc"><title id="title">New evidence can change a ranking vertical card</title><desc id="desc">A vertical Drivable synthetic education card showing a possible cause moving from low to moderate support while preserving versions, sources, conflicts, and missing information.</desc><rect width="1080" height="1920" fill="#EAF2F8"/><g font-family="Inter,Arial,sans-serif"><text x="72" y="168" font-size="27" font-weight="850" letter-spacing="2" fill="#106B85">HOW CONFIDENCE WORKS · 04/04</text><text x="72" y="300" font-size="66" font-weight="850" fill="#172334">New evidence can</text><text x="72" y="380" font-size="66" font-weight="850" fill="#172334">change a ranking.</text><text x="72" y="448" font-size="26" fill="#52677F">A revision adds context—it does not silently rewrite the past.</text>
<g transform="translate(72 560)"><rect width="936" height="330" rx="30" fill="#FFFFFF" stroke="#C9D6E4" stroke-width="2"/><rect x="38" y="36" width="148" height="42" rx="21" fill="#E7EDF3"/><text x="112" y="64" text-anchor="middle" font-size="16" font-weight="850" fill="#3A4D61">VERSION 1</text><rect x="700" y="36" width="196" height="46" rx="23" fill="#FFF2D1"/><text x="798" y="66" text-anchor="middle" font-size="17" font-weight="850" fill="#604713">LOW SUPPORT</text><text x="38" y="150" font-size="29" font-weight="800" fill="#172334">Owner-stated timing only</text><text x="38" y="202" font-size="22" fill="#52677F">Several possibilities remain.</text><text x="38" y="244" font-size="22" fill="#52677F">No device or test context supplied.</text></g>
<path d="M540 920v88" stroke="#106B85" stroke-width="7" stroke-linecap="round"/><path d="M516 984l24 26 24-26" fill="none" stroke="#106B85" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(72 1046)"><rect width="936" height="374" rx="30" fill="#11283B"/><rect x="38" y="36" width="148" height="42" rx="21" fill="#D7F7FF"/><text x="112" y="64" text-anchor="middle" font-size="16" font-weight="850" fill="#0B5269">VERSION 2</text><rect x="642" y="36" width="254" height="46" rx="23" fill="#D7F7FF"/><text x="769" y="66" text-anchor="middle" font-size="17" font-weight="850" fill="#0B5269">MODERATE SUPPORT</text><text x="38" y="150" font-size="29" font-weight="800" fill="#EDF5FF">New synthetic device entry added</text><text x="38" y="202" font-size="22" fill="#B8C9DA">The ranking changes because the evidence changed.</text><text x="38" y="252" font-size="21" fill="#B8C9DA">Earlier version, source labels, conflicts,</text><text x="38" y="288" font-size="21" fill="#B8C9DA">and missing items remain visible.</text></g>
<rect x="72" y="1470" width="936" height="132" rx="26" fill="#0B344B"/><text x="540" y="1526" text-anchor="middle" font-size="25" font-weight="900" fill="#FFFFFF">A HIGHER RANK IS NOT A CONFIRMED DIAGNOSIS.</text><text x="540" y="1566" text-anchor="middle" font-size="19" fill="#B8C9DA">Entire example is synthetic education—not a real result.</text><line x1="72" y1="1710" x2="1008" y2="1710" stroke="#C9D6E4" stroke-width="2"/><text x="72" y="1802" font-size="40" font-weight="850" fill="#172334">drivable</text><text x="258" y="1802" font-size="22" fill="#52677F">by Mechanic's Eye</text><text x="1008" y="1802" text-anchor="end" font-size="20" fill="#52677F">Story/reel concept · review</text></g></svg>
