<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">A conflict is a finding, not something to hide</title><desc id="desc">A Buyer Check educational card showing how conflicting dated sources should remain visible and prompt a follow-up question.</desc>
  <rect width="1080" height="1350" fill="#07111F"/><g font-family="Inter,Arial,sans-serif"><text x="78" y="96" fill="#79E9FF" font-size="28" font-weight="850" letter-spacing="2">BUYER CHECK · 03</text><text x="78" y="238" fill="#EDF5FF" font-size="72" font-weight="850">A conflict is a finding.</text><text x="78" y="324" fill="#79E9FF" font-size="72" font-weight="850">Do not write it away.</text><text x="78" y="390" fill="#9CB0C8" font-size="27">Keep both sources visible, with dates and scope.</text>
  <rect x="78" y="478" width="924" height="196" rx="28" fill="#10283B" stroke="#5C4B24" stroke-width="2"/><circle cx="126" cy="534" r="22" fill="#FFD27D"/><text x="166" y="543" fill="#EDF5FF" font-size="25" font-weight="850">SELLER STATEMENT · DAY 1</text><text x="120" y="608" fill="#EDF5FF" font-size="29" font-weight="750">“No warning light is currently showing.”</text><text x="120" y="644" fill="#9CB0C8" font-size="19">This records what the seller stated at that time.</text>
  <rect x="78" y="704" width="924" height="196" rx="28" fill="#10283B" stroke="#28506A" stroke-width="2"/><circle cx="126" cy="760" r="22" fill="#3BD6FF"/><text x="166" y="769" fill="#EDF5FF" font-size="25" font-weight="850">SUPPLIED RECORD · EARLIER DATE</text><text x="120" y="834" fill="#EDF5FF" font-size="29" font-weight="750">A dated record mentions a warning-light investigation.</text><text x="120" y="870" fill="#9CB0C8" font-size="19">An earlier record does not prove the current condition.</text>
  <rect x="78" y="948" width="924" height="154" rx="24" fill="#3B1822" stroke="#FF8F8F" stroke-width="2"/><text x="116" y="1000" fill="#FFD7D7" font-size="21" font-weight="850">FOLLOW-UP QUESTION</text><text x="116" y="1055" fill="#EDF5FF" font-size="27" font-weight="750">What happened between the dated record and today's statement?</text>
  <text x="78" y="1200" fill="#EDF5FF" font-size="38" font-weight="850">Drivable</text><text x="254" y="1200" fill="#9CB0C8" font-size="21">by Mechanic's Eye</text><text x="78" y="1270" fill="#9CB0C8" font-size="20">Synthetic education · not proof of deception, current condition, or vehicle safety.</text></g>
</svg>
