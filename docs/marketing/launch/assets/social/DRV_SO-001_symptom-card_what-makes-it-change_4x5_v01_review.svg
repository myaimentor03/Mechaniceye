<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">What conditions make the observation change?</title>
  <desc id="desc">A dark Drivable educational card prompting safely remembered comparisons about temperature, action, road conditions, and vehicle load without recreating a symptom.</desc>
  <rect width="1080" height="1350" fill="#07111F"/>
  <path d="M0 0 H1080 V250 C820 350 600 80 0 300 Z" fill="#0D1A2B"/>
  <g font-family="Inter,Arial,sans-serif">
    <text x="84" y="92" font-size="29" font-weight="800" letter-spacing="2" fill="#3BD6FF">WHAT CHANGED? · CARD 03</text>
    <text x="84" y="205" font-size="69" font-weight="850" fill="#EDF5FF">What makes it change?</text>
    <text x="84" y="274" font-size="28" fill="#9CB0C8">Compare only what you already noticed safely.</text>
    <g transform="translate(84 380)">
      <rect width="432" height="184" rx="26" fill="#122238" stroke="#223854" stroke-width="2"/>
      <circle cx="62" cy="60" r="26" fill="#3BD6FF"/><path d="M62 42 v25 M51 71 a13 13 0 1 0 22 0" fill="none" stroke="#07111F" stroke-width="5" stroke-linecap="round"/>
      <text x="110" y="60" font-size="29" font-weight="800" fill="#EDF5FF">Temperature</text>
      <text x="36" y="116" font-size="22" fill="#9CB0C8">Cold start, warmed up,</text><text x="36" y="148" font-size="22" fill="#9CB0C8">or hot weather?</text>
    </g>
    <g transform="translate(564 380)">
      <rect width="432" height="184" rx="26" fill="#122238" stroke="#223854" stroke-width="2"/>
      <circle cx="62" cy="60" r="26" fill="#3BD6FF"/><path d="M48 70 Q62 42 78 58" fill="none" stroke="#07111F" stroke-width="5" stroke-linecap="round"/>
      <text x="110" y="60" font-size="29" font-weight="800" fill="#EDF5FF">Action</text>
      <text x="36" y="116" font-size="22" fill="#9CB0C8">Starting, idling, braking,</text><text x="36" y="148" font-size="22" fill="#9CB0C8">turning, or accelerating?</text>
    </g>
    <g transform="translate(84 594)">
      <rect width="432" height="184" rx="26" fill="#122238" stroke="#223854" stroke-width="2"/>
      <circle cx="62" cy="60" r="26" fill="#FFD27D"/><path d="M45 70 q17 -25 34 0 M52 54 h20" fill="none" stroke="#07111F" stroke-width="5" stroke-linecap="round"/>
      <text x="110" y="60" font-size="29" font-weight="800" fill="#EDF5FF">Conditions</text>
      <text x="36" y="116" font-size="22" fill="#9CB0C8">Smooth road, bumps, rain,</text><text x="36" y="148" font-size="22" fill="#9CB0C8">hill, or highway speed?</text>
    </g>
    <g transform="translate(564 594)">
      <rect width="432" height="184" rx="26" fill="#122238" stroke="#223854" stroke-width="2"/>
      <circle cx="62" cy="60" r="26" fill="#FFD27D"/><path d="M47 68 h30 l-6 -20 h-18 z" fill="none" stroke="#07111F" stroke-width="5" stroke-linejoin="round"/>
      <text x="110" y="60" font-size="29" font-weight="800" fill="#EDF5FF">Vehicle state</text>
      <text x="36" y="116" font-size="22" fill="#9CB0C8">A/C on, added load, low fuel,</text><text x="36" y="148" font-size="22" fill="#9CB0C8">or after sitting?</text>
    </g>
    <rect x="84" y="838" width="912" height="246" rx="26" fill="#0B344B"/>
    <text x="124" y="898" font-size="28" font-weight="850" fill="#79E9FF">USE MEMORY. DO NOT RUN A TEST.</text>
    <text x="124" y="951" font-size="24" fill="#EDF5FF">Park before writing. Never continue driving, repeat a maneuver,</text>
    <text x="124" y="989" font-size="24" fill="#EDF5FF">or approach a hazard just to make a report more complete.</text>
    <text x="124" y="1041" font-size="21" fill="#B8C9DA">“I do not know” and “I could not observe this safely” are valid.</text>
    <line x1="84" y1="1202" x2="996" y2="1202" stroke="#223854" stroke-width="2"/>
    <text x="84" y="1282" font-size="38" font-weight="850" fill="#EDF5FF">drivable</text>
    <text x="258" y="1282" font-size="21" fill="#9CB0C8">by Mechanic's Eye</text>
    <text x="996" y="1282" font-size="20" text-anchor="end" fill="#9CB0C8">Educational card · not a diagnosis</text>
  </g>
</svg>
