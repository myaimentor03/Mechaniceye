<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">Buyer Check does not replace an independent inspection</title><desc id="desc">A Buyer Check educational card explaining the distinct roles of organized information, current verification, and a buyer decision.</desc>
  <rect width="1080" height="1350" fill="#F7F9FB"/><rect x="0" y="0" width="28" height="1350" fill="#3BD6FF"/><g font-family="Inter,Arial,sans-serif"><text x="86" y="100" fill="#106B85" font-size="28" font-weight="850" letter-spacing="2">BUYER CHECK · 04</text><text x="86" y="238" fill="#172334" font-size="68" font-weight="850">Organize the record.</text><text x="86" y="321" fill="#172334" font-size="68" font-weight="850">Then verify the vehicle.</text><text x="86" y="388" fill="#52677F" font-size="27">Buyer Check and an independent inspection answer different questions.</text>
  <g transform="translate(86 470)"><rect width="908" height="180" rx="26" fill="#FFFFFF" stroke="#C9D6E4" stroke-width="2"/><circle cx="56" cy="58" r="26" fill="#3BD6FF"/><text x="56" y="67" text-anchor="middle" fill="#07111F" font-size="24" font-weight="900">1</text><text x="104" y="66" fill="#172334" font-size="27" font-weight="850">BUYER CHECK ORGANIZES</text><text x="32" y="122" fill="#52677F" font-size="22">Seller statements, supplied records, supported positives,</text><text x="32" y="154" fill="#52677F" font-size="22">risks, conflicts, missing information, and next questions.</text></g>
  <g transform="translate(86 680)"><rect width="908" height="180" rx="26" fill="#FFFFFF" stroke="#C9D6E4" stroke-width="2"/><circle cx="56" cy="58" r="26" fill="#FFD27D"/><text x="56" y="67" text-anchor="middle" fill="#07111F" font-size="24" font-weight="900">2</text><text x="104" y="66" fill="#172334" font-size="27" font-weight="850">AN INSPECTION EXAMINES NOW</text><text x="32" y="122" fill="#52677F" font-size="22">A qualified independent professional can inspect or test</text><text x="32" y="154" fill="#52677F" font-size="22">the current vehicle within an agreed scope.</text></g>
  <g transform="translate(86 890)"><rect width="908" height="180" rx="26" fill="#11283B"/><circle cx="56" cy="58" r="26" fill="#79E9FF"/><text x="56" y="67" text-anchor="middle" fill="#07111F" font-size="24" font-weight="900">3</text><text x="104" y="66" fill="#EDF5FF" font-size="27" font-weight="850">THE BUYER DECIDES</text><text x="32" y="122" fill="#B8C9DA" font-size="22">Use the record, inspection, title/history sources, terms,</text><text x="32" y="154" fill="#B8C9DA" font-size="22">budget, and judgment appropriate to the transaction.</text></g>
  <text x="86" y="1172" fill="#172334" font-size="38" font-weight="850">Drivable</text><text x="262" y="1172" fill="#52677F" font-size="21">by Mechanic's Eye</text><text x="86" y="1250" fill="#52677F" font-size="20">Drivable does not verify the seller, title, mileage, current condition, or transaction.</text><text x="86" y="1282" fill="#52677F" font-size="20">Buyer Check is not a pre-purchase inspection.</text></g>
</svg>
