<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">Ask what was observed or measured</title><desc id="desc">A mechanic-conversation card distinguishing observations, measurements, interpretations, and unknowns without implying wrongdoing.</desc>
  <rect width="1080" height="1350" fill="#F7F9FB"/><rect x="0" width="28" height="1350" fill="#3BD6FF"/><g font-family="Inter,Arial,sans-serif"><text x="86" y="98" fill="#106B85" font-size="27" font-weight="850" letter-spacing="2">BETTER MECHANIC CONVERSATIONS · 03</text><text x="86" y="230" fill="#172334" font-size="72" font-weight="850">Ask what was</text><text x="86" y="315" fill="#172334" font-size="72" font-weight="850">observed or measured.</text><text x="86" y="378" fill="#52677F" font-size="27">Then ask what the evidence means—and what it does not.</text>
  <g transform="translate(86 455)"><rect width="430" height="205" rx="24" fill="#FFFFFF" stroke="#C9D6E4" stroke-width="2"/><circle cx="50" cy="52" r="22" fill="#3BD6FF"/><text x="88" y="60" fill="#172334" font-size="25" font-weight="850">OBSERVED</text><text x="30" y="118" fill="#52677F" font-size="22">What could the technician see,</text><text x="30" y="151" fill="#52677F" font-size="22">hear, feel, or reproduce?</text><text x="30" y="184" fill="#52677F" font-size="18">Scope and conditions matter.</text></g>
  <g transform="translate(564 455)"><rect width="430" height="205" rx="24" fill="#FFFFFF" stroke="#C9D6E4" stroke-width="2"/><circle cx="50" cy="52" r="22" fill="#79E9FF"/><text x="88" y="60" fill="#172334" font-size="25" font-weight="850">MEASURED</text><text x="30" y="118" fill="#52677F" font-size="22">Which reading, code, pressure,</text><text x="30" y="151" fill="#52677F" font-size="22">voltage, or test result?</text><text x="30" y="184" fill="#52677F" font-size="18">Ask for the test context.</text></g>
  <g transform="translate(86 700)"><rect width="430" height="205" rx="24" fill="#FFFFFF" stroke="#C9D6E4" stroke-width="2"/><circle cx="50" cy="52" r="22" fill="#FFD27D"/><text x="88" y="60" fill="#172334" font-size="25" font-weight="850">INTERPRETED</text><text x="30" y="118" fill="#52677F" font-size="22">How does the evidence support</text><text x="30" y="151" fill="#52677F" font-size="22">the recommended work?</text><text x="30" y="184" fill="#52677F" font-size="18">Interpretation is not measurement.</text></g>
  <g transform="translate(564 700)"><rect width="430" height="205" rx="24" fill="#FFF6F6" stroke="#F2B8B8" stroke-width="2"/><circle cx="50" cy="52" r="22" fill="#FF8F8F"/><text x="88" y="60" fill="#172334" font-size="25" font-weight="850">UNKNOWN</text><text x="30" y="118" fill="#52677F" font-size="22">What has not been tested,</text><text x="30" y="151" fill="#52677F" font-size="22">ruled out, or confirmed?</text><text x="30" y="184" fill="#52677F" font-size="18">Unknown is an honest result.</text></g>
  <rect x="86" y="982" width="908" height="128" rx="24" fill="#11283B"/><text x="540" y="1031" text-anchor="middle" fill="#EDF5FF" font-size="24" font-weight="850">CLEAR QUESTIONS ARE NOT ACCUSATIONS.</text><text x="540" y="1073" text-anchor="middle" fill="#B8C9DA" font-size="21">No phrase or missing detail alone proves dishonesty.</text><text x="86" y="1278" fill="#172334" font-size="38" font-weight="850">Drivable</text><text x="260" y="1278" fill="#52677F" font-size="21">by Mechanic's Eye</text><text x="994" y="1278" text-anchor="end" fill="#52677F" font-size="19">Save this framework</text></g>
</svg>
