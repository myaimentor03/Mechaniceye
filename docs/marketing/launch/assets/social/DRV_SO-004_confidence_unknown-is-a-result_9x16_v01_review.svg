<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-labelledby="title desc"><title id="title">Unknown can be a responsible result vertical card</title><desc id="desc">A vertical Drivable education card defining qualitative evidence-support states and separating confidence from diagnosis and vehicle safety.</desc><rect width="1080" height="1920" fill="#07111F"/><g font-family="Inter,Arial,sans-serif"><text x="72" y="168" font-size="27" font-weight="850" letter-spacing="2" fill="#3BD6FF">HOW CONFIDENCE WORKS · 01/04</text><text x="72" y="300" font-size="70" font-weight="850" fill="#EDF5FF">“Unknown” can be</text><text x="72" y="382" font-size="70" font-weight="850" fill="#EDF5FF">a responsible result.</text><text x="72" y="452" font-size="27" fill="#9CB0C8">Evidence should control the strength of the language.</text>
<g transform="translate(72 548)"><rect width="936" height="176" rx="26" fill="#122238"/><rect width="16" height="176" rx="8" fill="#9AF0C5"/><text x="56" y="68" font-size="28" font-weight="850" fill="#EDF5FF">HIGHER SUPPORT</text><text x="56" y="118" font-size="22" fill="#9CB0C8">Several relevant signals align; material conflicts are absent.</text></g><g transform="translate(72 756)"><rect width="936" height="176" rx="26" fill="#122238"/><rect width="16" height="176" rx="8" fill="#3BD6FF"/><text x="56" y="68" font-size="28" font-weight="850" fill="#EDF5FF">MODERATE SUPPORT</text><text x="56" y="118" font-size="22" fill="#9CB0C8">Useful signals align; missing evidence could change the ranking.</text></g><g transform="translate(72 964)"><rect width="936" height="176" rx="26" fill="#122238"/><rect width="16" height="176" rx="8" fill="#FFD27D"/><text x="56" y="68" font-size="28" font-weight="850" fill="#EDF5FF">LOW SUPPORT</text><text x="56" y="118" font-size="22" fill="#9CB0C8">Weak support; more evidence or human review may be needed.</text></g><g transform="translate(72 1172)"><rect width="936" height="218" rx="26" fill="#1A2637" stroke="#FFD27D" stroke-width="2"/><rect width="16" height="218" rx="8" fill="#FFD27D"/><text x="56" y="68" font-size="28" font-weight="850" fill="#EDF5FF">UNABLE TO RANK RESPONSIBLY</text><text x="56" y="118" font-size="22" fill="#9CB0C8">Evidence is too limited, conflicting, unsafe to collect,</text><text x="56" y="154" font-size="22" fill="#9CB0C8">or outside scope. Do not manufacture certainty.</text></g>
<text x="72" y="1490" font-size="29" font-weight="850" fill="#FFD27D">CONFIDENCE IS NOT A SAFETY RATING.</text><text x="72" y="1538" font-size="23" fill="#9CB0C8">Possible causes are not a confirmed diagnosis.</text><line x1="72" y1="1710" x2="1008" y2="1710" stroke="#223854" stroke-width="2"/><text x="72" y="1802" font-size="40" font-weight="850" fill="#EDF5FF">drivable</text><text x="258" y="1802" font-size="22" fill="#9CB0C8">by Mechanic's Eye</text><text x="1008" y="1802" text-anchor="end" font-size="20" fill="#9CB0C8">Story/reel concept · review</text></g></svg>
