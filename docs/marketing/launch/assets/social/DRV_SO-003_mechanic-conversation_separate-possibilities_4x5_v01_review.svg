<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">Ask what test separates the possibilities</title><desc id="desc">A respectful mechanic-conversation card encouraging a customer to ask which test distinguishes possible causes before replacing a part.</desc>
  <rect width="1080" height="1350" fill="#07111F"/><path d="M0 1030 C280 880 510 1180 1080 860" fill="none" stroke="#3BD6FF" stroke-width="4" opacity=".45"/><circle cx="320" cy="1005" r="13" fill="#FFD27D"/><circle cx="685" cy="1000" r="13" fill="#3BD6FF"/>
  <g font-family="Inter,Arial,sans-serif"><text x="84" y="104" fill="#79E9FF" font-size="27" font-weight="850" letter-spacing="2">BETTER MECHANIC CONVERSATIONS · 02</text><text x="84" y="260" fill="#EDF5FF" font-size="76" font-weight="850">Ask what test</text><text x="84" y="350" fill="#EDF5FF" font-size="76" font-weight="850">separates the</text><text x="84" y="440" fill="#79E9FF" font-size="76" font-weight="850">possibilities.</text>
  <rect x="84" y="530" width="912" height="230" rx="28" fill="#10283B" stroke="#28506A" stroke-width="2"/><text x="122" y="598" fill="#EDF5FF" font-size="28" font-weight="800">A useful question</text><text x="122" y="661" fill="#EDF5FF" font-size="31" font-weight="750">“What test would distinguish these causes</text><text x="122" y="706" fill="#EDF5FF" font-size="31" font-weight="750">before we replace a part?”</text>
  <text x="84" y="850" fill="#B8C9DA" font-size="27">A code, symptom, or first impression may support several paths.</text><text x="84" y="895" fill="#B8C9DA" font-size="27">Measured tests can narrow them.</text>
  <rect x="84" y="1058" width="912" height="92" rx="22" fill="#3BD6FF"/><text x="540" y="1115" text-anchor="middle" fill="#04131E" font-size="23" font-weight="900">TEST BEFORE PARTS · EVIDENCE BEFORE CERTAINTY</text>
  <text x="84" y="1275" fill="#EDF5FF" font-size="38" font-weight="850">Drivable</text><text x="260" y="1275" fill="#9CB0C8" font-size="21">by Mechanic's Eye</text><text x="996" y="1275" text-anchor="end" fill="#9CB0C8" font-size="19">Educational card · not repair advice</text></g>
</svg>
