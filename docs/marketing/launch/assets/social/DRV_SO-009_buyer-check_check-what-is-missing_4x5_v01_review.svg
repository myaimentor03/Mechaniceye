<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">Drivable Buyer Check social card</title>
  <desc id="desc">A Buyer Check card reading Before you chase the used car, check what is missing.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7F9FB"/>
      <stop offset="1" stop-color="#E8F5F8"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1A2B"/>
      <stop offset="1" stop-color="#07111F"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1350" fill="url(#bg)"/>
  <rect x="0" y="0" width="1080" height="228" fill="url(#panel)"/>
  <g font-family="Inter, Arial, Helvetica, sans-serif">
    <text x="72" y="98" fill="#EDF5FF" font-size="48" font-weight="800">Drivable</text>
    <text x="74" y="139" fill="#9CB0C8" font-size="20" font-weight="700" letter-spacing="3.5">BY MECHANIC'S EYE</text>
    <rect x="770" y="70" width="238" height="62" rx="31" fill="#3BD6FF" fill-opacity=".14" stroke="#3BD6FF" stroke-opacity=".5"/>
    <text x="811" y="109" fill="#BCEFFF" font-size="23" font-weight="850" letter-spacing="2">BUYER CHECK</text>
    <text x="72" y="365" fill="#172334" font-size="78" font-weight="800" letter-spacing="-2.6">
      <tspan x="72" dy="0">Before you chase</tspan>
      <tspan x="72" dy="94">the used car,</tspan>
      <tspan x="72" dy="94" fill="#087C9A">check what is missing.</tspan>
    </text>
    <text x="76" y="696" fill="#52657A" font-size="33" font-weight="500">
      <tspan x="76" dy="0">Keep seller claims separate from observed</tspan>
      <tspan x="76" dy="48">evidence. See supported positives, risks,</tspan>
      <tspan x="76" dy="48">contradictions, and inspection questions.</tspan>
    </text>
    <g transform="translate(72 870)">
      <rect x="0" y="0" width="284" height="112" rx="20" fill="#FFFFFF" stroke="#CAD4DF" stroke-width="3"/>
      <circle cx="50" cy="56" r="17" fill="#FFD27D"/>
      <text x="86" y="49" fill="#172334" font-size="22" font-weight="800">SELLER-REPORTED</text>
      <text x="86" y="78" fill="#64778B" font-size="18">Source stays visible</text>
      <rect x="310" y="0" width="284" height="112" rx="20" fill="#FFFFFF" stroke="#CAD4DF" stroke-width="3"/>
      <circle cx="360" cy="56" r="17" fill="#3BD6FF"/>
      <text x="396" y="49" fill="#172334" font-size="22" font-weight="800">OBSERVED</text>
      <text x="396" y="78" fill="#64778B" font-size="18">Scope and date matter</text>
      <rect x="620" y="0" width="316" height="112" rx="20" fill="#FFFFFF" stroke="#CAD4DF" stroke-width="3"/>
      <circle cx="670" cy="56" r="17" fill="#FF8F8F"/>
      <text x="706" y="49" fill="#172334" font-size="22" font-weight="800">UNKNOWN</text>
      <text x="706" y="78" fill="#64778B" font-size="18">Needs verification</text>
    </g>
    <rect x="72" y="1050" width="470" height="86" rx="20" fill="#0B344B"/>
    <text x="307" y="1105" text-anchor="middle" fill="#FFFFFF" font-size="24" font-weight="850" letter-spacing="1">LEARN ABOUT BUYER CHECK</text>
    <line x1="72" y1="1197" x2="1008" y2="1197" stroke="#CAD4DF" stroke-width="3"/>
    <text x="72" y="1245" fill="#52657A" font-size="21" font-weight="500">
      <tspan x="72" dy="0">Not a pre-purchase inspection. Drivable does not verify the seller,</tspan>
      <tspan x="72" dy="33">title, mileage, vehicle condition, or transaction.</tspan>
    </text>
  </g>
</svg>
