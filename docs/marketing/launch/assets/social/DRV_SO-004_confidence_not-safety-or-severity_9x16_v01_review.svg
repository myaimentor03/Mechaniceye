<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-labelledby="title desc"><title id="title">Confidence answers how supported vertical card</title><desc id="desc">A vertical Drivable education card separating evidence support from urgency, severity, diagnosis, and vehicle safety.</desc><rect width="1080" height="1920" fill="#F7F9FB"/><rect width="28" height="1920" fill="#FF8F8F"/><g font-family="Inter,Arial,sans-serif"><text x="78" y="168" font-size="27" font-weight="850" letter-spacing="2" fill="#106B85">HOW CONFIDENCE WORKS · 02/04</text><text x="78" y="300" font-size="68" font-weight="850" fill="#172334">Confidence answers:</text><text x="78" y="382" font-size="68" font-weight="850" fill="#172334">“How supported?”</text><text x="78" y="452" font-size="27" fill="#52677F">It does not answer every other decision.</text>
<g transform="translate(78 548)"><rect width="930" height="200" rx="28" fill="#FFFFFF" stroke="#C9D6E4" stroke-width="2"/><circle cx="70" cy="68" r="30" fill="#3BD6FF"/><text x="126" y="77" font-size="28" font-weight="850" fill="#172334">CONFIDENCE</text><text x="42" y="132" font-size="22" fill="#52677F">How strongly does the available evidence support a possibility?</text></g>
<g transform="translate(78 788)"><rect width="930" height="178" rx="26" fill="#FFF6F6" stroke="#F2B8B8" stroke-width="2"/><text x="38" y="64" font-size="27" font-weight="850" fill="#6D2424">NOT URGENCY</text><text x="300" y="64" font-size="22" fill="#52677F">How quickly qualified help may be needed.</text><text x="38" y="120" font-size="20" fill="#52677F">Safety signals require separate handling regardless of confidence.</text></g><g transform="translate(78 996)"><rect width="930" height="178" rx="26" fill="#FFF6F6" stroke="#F2B8B8" stroke-width="2"/><text x="38" y="64" font-size="27" font-weight="850" fill="#6D2424">NOT SEVERITY</text><text x="300" y="64" font-size="22" fill="#52677F">How serious, costly, or damaging a condition may be.</text><text x="38" y="120" font-size="20" fill="#52677F">Confidence describes support—not impact.</text></g><g transform="translate(78 1204)"><rect width="930" height="178" rx="26" fill="#FFF6F6" stroke="#F2B8B8" stroke-width="2"/><text x="38" y="64" font-size="27" font-weight="850" fill="#6D2424">NOT A DIAGNOSIS</text><text x="330" y="64" font-size="22" fill="#52677F">A ranked possibility can differ from an inspection.</text><text x="38" y="120" font-size="20" fill="#52677F">Possible causes remain possibilities.</text></g><g transform="translate(78 1412)"><rect width="930" height="178" rx="26" fill="#FFF6F6" stroke="#F2B8B8" stroke-width="2"/><text x="38" y="64" font-size="27" font-weight="850" fill="#6D2424">NOT SAFETY</text><text x="300" y="64" font-size="22" fill="#52677F">No confidence label declares a vehicle safe to drive.</text><text x="38" y="120" font-size="20" fill="#52677F">Do not delay appropriate help while waiting for a result.</text></g>
<line x1="78" y1="1710" x2="1008" y2="1710" stroke="#C9D6E4" stroke-width="2"/><text x="78" y="1802" font-size="40" font-weight="850" fill="#172334">drivable</text><text x="264" y="1802" font-size="22" fill="#52677F">by Mechanic's Eye</text><text x="1008" y="1802" text-anchor="end" font-size="20" fill="#52677F">Story/reel concept · review</text></g></svg>
