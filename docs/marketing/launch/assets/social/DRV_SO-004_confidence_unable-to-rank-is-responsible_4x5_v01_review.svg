<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">Unable to rank can be the responsible answer</title><desc id="desc">A dark Drivable educational card showing limited, conflicting, unsafe-to-collect, and out-of-scope evidence as valid reasons not to rank possible causes.</desc>
  <rect width="1080" height="1350" fill="#07111F"/><g font-family="Inter,Arial,sans-serif"><text x="84" y="100" fill="#79E9FF" font-size="28" font-weight="850" letter-spacing="2">HOW CONFIDENCE WORKS · 03</text><text x="84" y="242" fill="#EDF5FF" font-size="70" font-weight="850">Unable to rank can be</text><text x="84" y="326" fill="#79E9FF" font-size="70" font-weight="850">the responsible answer.</text><text x="84" y="392" fill="#9CB0C8" font-size="27">A forced list is not more useful than an honest limit.</text>
  <g transform="translate(84 474)"><rect width="430" height="184" rx="24" fill="#10283B" stroke="#28506A" stroke-width="2"/><circle cx="52" cy="50" r="22" fill="#FFD27D"/><text x="92" y="59" fill="#EDF5FF" font-size="24" font-weight="850">TOO LIMITED</text><text x="30" y="116" fill="#9CB0C8" font-size="21">The available details do not</text><text x="30" y="149" fill="#9CB0C8" font-size="21">support a responsible ranking.</text></g>
  <g transform="translate(566 474)"><rect width="430" height="184" rx="24" fill="#10283B" stroke="#28506A" stroke-width="2"/><circle cx="52" cy="50" r="22" fill="#FF8F8F"/><text x="92" y="59" fill="#EDF5FF" font-size="24" font-weight="850">CONFLICTING</text><text x="30" y="116" fill="#9CB0C8" font-size="21">Material sources point in</text><text x="30" y="149" fill="#9CB0C8" font-size="21">different directions.</text></g>
  <g transform="translate(84 690)"><rect width="430" height="184" rx="24" fill="#10283B" stroke="#28506A" stroke-width="2"/><circle cx="52" cy="50" r="22" fill="#79E9FF"/><text x="92" y="59" fill="#EDF5FF" font-size="24" font-weight="850">UNSAFE TO COLLECT</text><text x="30" y="116" fill="#9CB0C8" font-size="21">Useful evidence would require</text><text x="30" y="149" fill="#9CB0C8" font-size="21">a risk the user should not take.</text></g>
  <g transform="translate(566 690)"><rect width="430" height="184" rx="24" fill="#10283B" stroke="#28506A" stroke-width="2"/><circle cx="52" cy="50" r="22" fill="#9AF0C5"/><text x="92" y="59" fill="#EDF5FF" font-size="24" font-weight="850">OUT OF SCOPE</text><text x="30" y="116" fill="#9CB0C8" font-size="21">The question needs hands-on,</text><text x="30" y="149" fill="#9CB0C8" font-size="21">specialized, or emergency help.</text></g>
  <rect x="84" y="932" width="912" height="184" rx="28" fill="#3B1822" stroke="#FF8F8F" stroke-width="2"/><text x="124" y="990" fill="#FFD7D7" font-size="21" font-weight="850">RESPONSIBLE NEXT STEP</text><text x="124" y="1044" fill="#EDF5FF" font-size="27" font-weight="750">Request safe written details, route to human review,</text><text x="124" y="1084" fill="#EDF5FF" font-size="27" font-weight="750">or recommend appropriate in-person help.</text>
  <text x="84" y="1230" fill="#EDF5FF" font-size="38" font-weight="850">Drivable</text><text x="260" y="1230" fill="#9CB0C8" font-size="21">by Mechanic's Eye</text><text x="84" y="1292" fill="#9CB0C8" font-size="19">Do not delay qualified or emergency help while waiting for a result.</text></g>
</svg>
