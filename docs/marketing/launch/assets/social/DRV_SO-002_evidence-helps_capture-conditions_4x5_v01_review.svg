<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">Capture the conditions, not a guessed cause</title><desc id="desc">A Drivable educational card showing safe written details about when and under what conditions a vehicle symptom occurred.</desc>
  <rect width="1080" height="1350" fill="#EAF2F8"/><g font-family="Inter,Arial,sans-serif"><text x="84" y="100" fill="#106B85" font-size="28" font-weight="850" letter-spacing="2">DRIVABLE CHECK · EVIDENCE 02</text><text x="84" y="235" fill="#172334" font-size="72" font-weight="850">Capture the conditions.</text><text x="84" y="320" fill="#172334" font-size="72" font-weight="850">Not a guessed cause.</text><text x="84" y="384" fill="#52677F" font-size="27">Write the details after you are safely parked.</text>
  <g transform="translate(84 458)"><rect width="274" height="224" rx="26" fill="#FFFFFF" stroke="#C9D6E4" stroke-width="2"/><circle cx="50" cy="52" r="22" fill="#3BD6FF"/><text x="86" y="61" fill="#172334" font-size="23" font-weight="850">WHEN</text><text x="30" y="120" fill="#52677F" font-size="21">Cold start?</text><text x="30" y="154" fill="#52677F" font-size="21">After warming?</text><text x="30" y="188" fill="#52677F" font-size="21">Intermittent?</text></g>
  <g transform="translate(403 458)"><rect width="274" height="224" rx="26" fill="#FFFFFF" stroke="#C9D6E4" stroke-width="2"/><circle cx="50" cy="52" r="22" fill="#79E9FF"/><text x="86" y="61" fill="#172334" font-size="23" font-weight="850">ACTION</text><text x="30" y="120" fill="#52677F" font-size="21">Starting?</text><text x="30" y="154" fill="#52677F" font-size="21">Braking?</text><text x="30" y="188" fill="#52677F" font-size="21">Turning or idling?</text></g>
  <g transform="translate(722 458)"><rect width="274" height="224" rx="26" fill="#FFFFFF" stroke="#C9D6E4" stroke-width="2"/><circle cx="50" cy="52" r="22" fill="#FFD27D"/><text x="86" y="61" fill="#172334" font-size="23" font-weight="850">CONTEXT</text><text x="30" y="120" fill="#52677F" font-size="21">Weather?</text><text x="30" y="154" fill="#52677F" font-size="21">Fuel or service?</text><text x="30" y="188" fill="#52677F" font-size="21">Load or road?</text></g>
  <rect x="84" y="742" width="912" height="206" rx="28" fill="#11283B"/><text x="124" y="804" fill="#79E9FF" font-size="22" font-weight="850">A STRONGER NOTE</text><text x="124" y="858" fill="#EDF5FF" font-size="27" font-weight="750">“Twice after sitting overnight, the engine felt uneven</text><text x="124" y="897" fill="#EDF5FF" font-size="27" font-weight="750">for about twenty seconds. I do not know the cause.”</text>
  <rect x="84" y="1015" width="912" height="108" rx="22" fill="#FFD27D"/><text x="540" y="1058" text-anchor="middle" fill="#07111F" font-size="23" font-weight="900">DO NOT RECREATE A SYMPTOM FOR CONTENT</text><text x="540" y="1092" text-anchor="middle" fill="#07111F" font-size="20">Park first. Write from memory. Seek qualified help when needed.</text><text x="84" y="1278" fill="#172334" font-size="38" font-weight="850">Drivable</text><text x="260" y="1278" fill="#52677F" font-size="21">by Mechanic's Eye</text><text x="996" y="1278" text-anchor="end" fill="#52677F" font-size="19">Educational card · not a diagnosis</text></g>
</svg>
