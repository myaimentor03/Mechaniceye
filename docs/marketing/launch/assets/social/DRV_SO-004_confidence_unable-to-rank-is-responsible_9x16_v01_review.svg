<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-labelledby="title desc"><title id="title">Unable to rank can be responsible vertical card</title><desc id="desc">A vertical Drivable education card explaining limited, conflicting, unsafe-to-collect, and out-of-scope evidence as reasons not to rank possible causes.</desc><rect width="1080" height="1920" fill="#07111F"/><g font-family="Inter,Arial,sans-serif"><text x="72" y="168" font-size="27" font-weight="850" letter-spacing="2" fill="#79E9FF">HOW CONFIDENCE WORKS · 03/04</text><text x="72" y="300" font-size="66" font-weight="850" fill="#EDF5FF">Unable to rank can be</text><text x="72" y="380" font-size="66" font-weight="850" fill="#79E9FF">the responsible answer.</text><text x="72" y="448" font-size="26" fill="#9CB0C8">A forced list is not more useful than an honest limit.</text>
<g transform="translate(72 548)"><rect width="936" height="184" rx="28" fill="#10283B" stroke="#28506A" stroke-width="2"/><circle cx="70" cy="66" r="28" fill="#FFD27D"/><text x="124" y="75" font-size="27" font-weight="850" fill="#EDF5FF">TOO LIMITED</text><text x="124" y="124" font-size="22" fill="#9CB0C8">Available details do not support a responsible ranking.</text></g><g transform="translate(72 764)"><rect width="936" height="184" rx="28" fill="#10283B" stroke="#28506A" stroke-width="2"/><circle cx="70" cy="66" r="28" fill="#FF8F8F"/><text x="124" y="75" font-size="27" font-weight="850" fill="#EDF5FF">CONFLICTING</text><text x="124" y="124" font-size="22" fill="#9CB0C8">Material sources point in different directions.</text></g><g transform="translate(72 980)"><rect width="936" height="184" rx="28" fill="#10283B" stroke="#28506A" stroke-width="2"/><circle cx="70" cy="66" r="28" fill="#79E9FF"/><text x="124" y="75" font-size="27" font-weight="850" fill="#EDF5FF">UNSAFE TO COLLECT</text><text x="124" y="124" font-size="22" fill="#9CB0C8">Useful evidence would require a risk the user should not take.</text></g><g transform="translate(72 1196)"><rect width="936" height="184" rx="28" fill="#10283B" stroke="#28506A" stroke-width="2"/><circle cx="70" cy="66" r="28" fill="#9AF0C5"/><text x="124" y="75" font-size="27" font-weight="850" fill="#EDF5FF">OUT OF SCOPE</text><text x="124" y="124" font-size="22" fill="#9CB0C8">The question needs hands-on, specialized, or emergency help.</text></g>
<rect x="72" y="1426" width="936" height="178" rx="28" fill="#3B1822" stroke="#FF8F8F" stroke-width="2"/><text x="112" y="1488" font-size="23" font-weight="850" fill="#FFD7D7">RESPONSIBLE NEXT STEP</text><text x="112" y="1536" font-size="22" fill="#EDF5FF">Safe written follow-up, human review, or appropriate in-person help.</text><text x="112" y="1574" font-size="19" fill="#FFD7D7">Do not delay qualified or emergency help while waiting for a result.</text>
<line x1="72" y1="1710" x2="1008" y2="1710" stroke="#223854" stroke-width="2"/><text x="72" y="1802" font-size="40" font-weight="850" fill="#EDF5FF">drivable</text><text x="258" y="1802" font-size="22" fill="#9CB0C8">by Mechanic's Eye</text><text x="1008" y="1802" text-anchor="end" font-size="20" fill="#9CB0C8">Story/reel concept · review</text></g></svg>
