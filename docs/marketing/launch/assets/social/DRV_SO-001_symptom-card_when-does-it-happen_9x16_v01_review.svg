<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-labelledby="title desc">
  <title id="title">When does the vehicle symptom happen vertical educational card</title>
  <desc id="desc">A vertical Drivable story card prompting safely remembered timing and conditions without guessing at a diagnosis or recreating a symptom.</desc>
  <rect width="1080" height="1920" fill="#07111F"/><circle cx="1010" cy="170" r="280" fill="#0D1A2B"/>
  <g font-family="Inter,Arial,sans-serif">
    <text x="72" y="168" font-size="27" font-weight="850" letter-spacing="2" fill="#3BD6FF">WHAT CHANGED? · 01/04</text>
    <text x="72" y="300" font-size="76" font-weight="850" fill="#EDF5FF">When does it</text><text x="72" y="388" font-size="76" font-weight="850" fill="#EDF5FF">happen?</text>
    <text x="72" y="462" font-size="28" fill="#9CB0C8">Timing can be useful evidence. You do not need to name the part.</text>
    <g transform="translate(72 550)" font-size="27" font-weight="780">
      <rect width="444" height="150" rx="26" fill="#122238" stroke="#223854" stroke-width="2"/><circle cx="62" cy="58" r="25" fill="#3BD6FF"/><text x="106" y="66" fill="#EDF5FF">At startup?</text><text x="34" y="116" font-size="21" font-weight="400" fill="#9CB0C8">Cold, warm, or after sitting?</text>
      <g transform="translate(492 0)"><rect width="444" height="150" rx="26" fill="#122238" stroke="#223854" stroke-width="2"/><circle cx="62" cy="58" r="25" fill="#3BD6FF"/><text x="106" y="66" fill="#EDF5FF">While idling?</text><text x="34" y="116" font-size="21" font-weight="400" fill="#9CB0C8">In park, in gear, or with A/C?</text></g>
      <g transform="translate(0 182)"><rect width="444" height="150" rx="26" fill="#122238" stroke="#223854" stroke-width="2"/><circle cx="62" cy="58" r="25" fill="#3BD6FF"/><text x="106" y="66" fill="#EDF5FF">During braking?</text><text x="34" y="116" font-size="21" font-weight="400" fill="#9CB0C8">Light, firm, low speed, downhill?</text></g>
      <g transform="translate(492 182)"><rect width="444" height="150" rx="26" fill="#122238" stroke="#223854" stroke-width="2"/><circle cx="62" cy="58" r="25" fill="#3BD6FF"/><text x="106" y="66" fill="#EDF5FF">While turning?</text><text x="34" y="116" font-size="21" font-weight="400" fill="#9CB0C8">Left, right, tight turns, bumps?</text></g>
      <g transform="translate(0 364)"><rect width="444" height="150" rx="26" fill="#122238" stroke="#223854" stroke-width="2"/><circle cx="62" cy="58" r="25" fill="#FFD27D"/><text x="106" y="66" fill="#EDF5FF">Under load?</text><text x="34" y="116" font-size="21" font-weight="400" fill="#9CB0C8">Accelerating, climbing, weight?</text></g>
      <g transform="translate(492 364)"><rect width="444" height="150" rx="26" fill="#122238" stroke="#223854" stroke-width="2"/><circle cx="62" cy="58" r="25" fill="#FFD27D"/><text x="106" y="66" fill="#EDF5FF">Not sure?</text><text x="34" y="116" font-size="21" font-weight="400" fill="#9CB0C8">Unknown is useful. Do not guess.</text></g>
    </g>
    <rect x="72" y="1140" width="936" height="324" rx="30" fill="#0B344B"/>
    <text x="112" y="1206" font-size="29" font-weight="850" fill="#79E9FF">PARK FIRST. WRITE FROM MEMORY.</text>
    <text x="112" y="1272" font-size="25" fill="#EDF5FF">Never type, record, photograph, or connect</text><text x="112" y="1314" font-size="25" fill="#EDF5FF">equipment while driving.</text>
    <text x="112" y="1376" font-size="25" fill="#EDF5FF">Do not continue driving or recreate a symptom</text><text x="112" y="1418" font-size="25" fill="#EDF5FF">to make the observation more complete.</text>
    <text x="72" y="1572" font-size="28" font-weight="800" fill="#FFD27D">Educational information only.</text>
    <text x="72" y="1616" font-size="23" fill="#9CB0C8">Not a diagnosis, inspection, emergency service, or safety determination.</text>
    <line x1="72" y1="1710" x2="1008" y2="1710" stroke="#223854" stroke-width="2"/>
    <text x="72" y="1802" font-size="40" font-weight="850" fill="#EDF5FF">drivable</text><text x="258" y="1802" font-size="22" fill="#9CB0C8">by Mechanic's Eye</text>
    <text x="1008" y="1802" text-anchor="end" font-size="20" fill="#9CB0C8">Story/reel concept · review</text>
  </g>
</svg>
