<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">Confidence is not safety, severity, or certainty</title><desc id="desc">A Drivable educational card separating evidence confidence from urgency, severity, diagnostic certainty, and vehicle safety.</desc>
  <rect width="1080" height="1350" fill="#F7F9FB"/><rect x="0" width="28" height="1350" fill="#FF8F8F"/><g font-family="Inter,Arial,sans-serif"><text x="86" y="100" fill="#106B85" font-size="28" font-weight="850" letter-spacing="2">HOW CONFIDENCE WORKS · 02</text><text x="86" y="238" fill="#172334" font-size="72" font-weight="850">Confidence answers:</text><text x="86" y="323" fill="#172334" font-size="72" font-weight="850">“How supported?”</text><text x="86" y="390" fill="#52677F" font-size="27">It does not answer every other decision.</text>
  <g transform="translate(86 470)"><rect width="908" height="142" rx="24" fill="#FFFFFF" stroke="#C9D6E4" stroke-width="2"/><circle cx="56" cy="52" r="24" fill="#3BD6FF"/><text x="100" y="60" fill="#172334" font-size="27" font-weight="850">CONFIDENCE</text><text x="32" y="108" fill="#52677F" font-size="22">How strongly does the available evidence support a possibility?</text></g>
  <g transform="translate(86 640)"><rect width="430" height="200" rx="24" fill="#FFF6F6" stroke="#F2B8B8" stroke-width="2"/><text x="30" y="58" fill="#6D2424" font-size="24" font-weight="850">NOT URGENCY</text><text x="30" y="108" fill="#52677F" font-size="21">How quickly a person should</text><text x="30" y="140" fill="#52677F" font-size="21">seek qualified help.</text><text x="30" y="176" fill="#52677F" font-size="18">Safety signals need separate handling.</text></g>
  <g transform="translate(564 640)"><rect width="430" height="200" rx="24" fill="#FFF6F6" stroke="#F2B8B8" stroke-width="2"/><text x="30" y="58" fill="#6D2424" font-size="24" font-weight="850">NOT SEVERITY</text><text x="30" y="108" fill="#52677F" font-size="21">How serious, expensive, or</text><text x="30" y="140" fill="#52677F" font-size="21">damaging a condition may be.</text><text x="30" y="176" fill="#52677F" font-size="18">Confidence does not measure impact.</text></g>
  <g transform="translate(86 868)"><rect width="430" height="200" rx="24" fill="#FFF6F6" stroke="#F2B8B8" stroke-width="2"/><text x="30" y="58" fill="#6D2424" font-size="24" font-weight="850">NOT A DIAGNOSIS</text><text x="30" y="108" fill="#52677F" font-size="21">A ranked possibility can differ</text><text x="30" y="140" fill="#52677F" font-size="21">from an in-person conclusion.</text></g>
  <g transform="translate(564 868)"><rect width="430" height="200" rx="24" fill="#FFF6F6" stroke="#F2B8B8" stroke-width="2"/><text x="30" y="58" fill="#6D2424" font-size="24" font-weight="850">NOT SAFETY</text><text x="30" y="108" fill="#52677F" font-size="21">No confidence label declares</text><text x="30" y="140" fill="#52677F" font-size="21">a vehicle safe to drive.</text></g>
  <text x="86" y="1200" fill="#172334" font-size="38" font-weight="850">Drivable</text><text x="262" y="1200" fill="#52677F" font-size="21">by Mechanic's Eye</text><text x="86" y="1273" fill="#52677F" font-size="20">Confidence describes evidence support only. It is not a safety clearance.</text></g>
</svg>
