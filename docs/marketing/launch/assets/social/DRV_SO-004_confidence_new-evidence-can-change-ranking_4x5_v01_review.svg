<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">New evidence can change a confidence ranking</title><desc id="desc">A Drivable educational card showing a possible cause moving from low to moderate support after new synthetic evidence while preserving the earlier version.</desc>
  <rect width="1080" height="1350" fill="#EAF2F8"/><g font-family="Inter,Arial,sans-serif"><text x="84" y="100" fill="#106B85" font-size="28" font-weight="850" letter-spacing="2">HOW CONFIDENCE WORKS · 04</text><text x="84" y="238" fill="#172334" font-size="68" font-weight="850">New evidence can change</text><text x="84" y="320" fill="#172334" font-size="68" font-weight="850">a confidence ranking.</text><text x="84" y="388" fill="#52677F" font-size="27">A revision should add context—not silently rewrite the past.</text>
  <rect x="84" y="470" width="912" height="214" rx="28" fill="#FFFFFF" stroke="#C9D6E4" stroke-width="2"/><rect x="114" y="500" width="148" height="38" rx="19" fill="#E7EDF3"/><text x="188" y="526" text-anchor="middle" fill="#3A4D61" font-size="16" font-weight="850">VERSION 1</text><rect x="760" y="500" width="190" height="44" rx="22" fill="#FFF2D1"/><text x="855" y="529" text-anchor="middle" fill="#604713" font-size="17" font-weight="850">LOW SUPPORT</text><text x="114" y="590" fill="#172334" font-size="28" font-weight="800">Owner-stated timing only</text><text x="114" y="632" fill="#52677F" font-size="21">Several possibilities remain; no device or test context supplied.</text>
  <path d="M540 705v76" stroke="#106B85" stroke-width="6" stroke-linecap="round"/><path d="M518 760l22 24 22-24" fill="none" stroke="#106B85" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="84" y="806" width="912" height="238" rx="28" fill="#11283B"/><rect x="114" y="836" width="148" height="38" rx="19" fill="#D7F7FF"/><text x="188" y="862" text-anchor="middle" fill="#0B5269" font-size="16" font-weight="850">VERSION 2</text><rect x="706" y="836" width="244" height="44" rx="22" fill="#D7F7FF"/><text x="828" y="865" text-anchor="middle" fill="#0B5269" font-size="17" font-weight="850">MODERATE SUPPORT</text><text x="114" y="928" fill="#EDF5FF" font-size="28" font-weight="800">New synthetic device entry added</text><text x="114" y="970" fill="#B8C9DA" font-size="21">The ranking changes because the evidence changed.</text><text x="114" y="1010" fill="#B8C9DA" font-size="21">The earlier version, source labels, conflicts, and missing items remain visible.</text>
  <rect x="84" y="1090" width="912" height="86" rx="20" fill="#0B344B"/><text x="540" y="1144" text-anchor="middle" fill="#FFFFFF" font-size="23" font-weight="900">A HIGHER RANK IS STILL NOT A CONFIRMED DIAGNOSIS</text><text x="84" y="1272" fill="#172334" font-size="38" font-weight="850">Drivable</text><text x="260" y="1272" fill="#52677F" font-size="21">by Mechanic's Eye</text><text x="996" y="1272" text-anchor="end" fill="#52677F" font-size="19">Synthetic education</text></g>
</svg>
