<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">An OBD code reports a condition, not necessarily the failed part</title><desc id="desc">A Drivable educational card explaining how to record user-entered OBD information without treating a code as a confirmed component diagnosis.</desc>
  <rect width="1080" height="1350" fill="#07111F"/><g font-family="Inter,Arial,sans-serif"><text x="84" y="100" fill="#79E9FF" font-size="28" font-weight="850" letter-spacing="2">DRIVABLE CHECK · EVIDENCE 03</text><text x="84" y="235" fill="#EDF5FF" font-size="70" font-weight="850">A code reports</text><text x="84" y="318" fill="#EDF5FF" font-size="70" font-weight="850">a condition.</text><text x="84" y="401" fill="#79E9FF" font-size="70" font-weight="850">Not always the culprit.</text>
  <rect x="84" y="480" width="912" height="190" rx="28" fill="#10283B" stroke="#28506A" stroke-width="2"/><text x="126" y="552" fill="#EDF5FF" font-size="52" font-weight="900" letter-spacing="3">P0301</text><text x="344" y="548" fill="#EDF5FF" font-size="28" font-weight="750">Cylinder 1 Misfire Detected</text><text x="126" y="620" fill="#9CB0C8" font-size="21">Example code for education—not a result from a real vehicle.</text>
  <text x="84" y="758" fill="#9CB0C8" font-size="27">If you already have a code, record:</text><circle cx="100" cy="822" r="8" fill="#3BD6FF"/><text x="130" y="832" fill="#EDF5FF" font-size="26">the exact letters and numbers;</text><circle cx="100" cy="885" r="8" fill="#3BD6FF"/><text x="130" y="895" fill="#EDF5FF" font-size="26">when it was read and whether the light was active;</text><circle cx="100" cy="948" r="8" fill="#3BD6FF"/><text x="130" y="958" fill="#EDF5FF" font-size="26">the device or source that displayed it.</text>
  <rect x="84" y="1032" width="912" height="112" rx="22" fill="#FFD27D"/><text x="540" y="1076" text-anchor="middle" fill="#07111F" font-size="23" font-weight="900">A CODE DOES NOT PROVE WHICH PART FAILED</text><text x="540" y="1111" text-anchor="middle" fill="#07111F" font-size="20">Testing and inspection may still be required.</text><text x="84" y="1278" fill="#EDF5FF" font-size="38" font-weight="850">Drivable</text><text x="260" y="1278" fill="#9CB0C8" font-size="21">by Mechanic's Eye</text><text x="996" y="1278" text-anchor="end" fill="#9CB0C8" font-size="19">User-entered context · not a diagnosis</text></g>
</svg>
