<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">A supported positive still needs a visible source</title><desc id="desc">A Buyer Check educational card distinguishing a seller claim, a supplied record, and unknown current condition.</desc>
  <rect width="1080" height="1350" fill="#EAF2F8"/><rect width="1080" height="210" fill="#07111F"/><g font-family="Inter,Arial,sans-serif"><text x="72" y="86" fill="#EDF5FF" font-size="46" font-weight="850">Drivable</text><text x="74" y="130" fill="#9CB0C8" font-size="20" font-weight="750" letter-spacing="3">BUYER CHECK · 02</text><text x="72" y="326" fill="#172334" font-size="69" font-weight="850">A supported positive</text><text x="72" y="410" fill="#172334" font-size="69" font-weight="850">still needs a source.</text><text x="72" y="474" fill="#52677F" font-size="27">Evidence can support a statement without proving everything around it.</text>
  <g transform="translate(72 548)"><rect width="936" height="150" rx="24" fill="#FFF9EA" stroke="#E5C46D" stroke-width="2"/><rect x="26" y="24" width="194" height="38" rx="19" fill="#FFD27D"/><text x="123" y="50" text-anchor="middle" fill="#604713" font-size="16" font-weight="850">SELLER-REPORTED</text><text x="26" y="108" fill="#172334" font-size="27" font-weight="750">“A component was replaced after a warning light.”</text></g>
  <g transform="translate(72 724)"><rect width="936" height="150" rx="24" fill="#FFFFFF" stroke="#C9D6E4" stroke-width="2"/><rect x="26" y="24" width="208" height="38" rx="19" fill="#D7F7FF"/><text x="130" y="50" text-anchor="middle" fill="#0B5269" font-size="16" font-weight="850">RECORD SUPPLIED</text><text x="26" y="108" fill="#172334" font-size="27" font-weight="750">A dated service record states that replacement occurred.</text></g>
  <g transform="translate(72 900)"><rect width="936" height="150" rx="24" fill="#FFF6F6" stroke="#F2B8B8" stroke-width="2"/><rect x="26" y="24" width="128" height="38" rx="19" fill="#FFD7D7"/><text x="90" y="50" text-anchor="middle" fill="#6D2424" font-size="16" font-weight="850">UNKNOWN</text><text x="26" y="108" fill="#172334" font-size="27" font-weight="750">Current condition and whether the work resolved the issue.</text></g>
  <rect x="72" y="1090" width="936" height="86" rx="20" fill="#0B344B"/><text x="540" y="1144" text-anchor="middle" fill="#FFFFFF" font-size="23" font-weight="900">SUPPORTED DOES NOT MEAN INDEPENDENTLY VERIFIED</text><text x="72" y="1260" fill="#52677F" font-size="20">Educational example · not a real listing, inspection, condition report, or transaction.</text></g>
</svg>
