<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024" role="img" aria-labelledby="title desc">
  <title id="title">Synthetic Drivable evidence record concept</title><desc id="desc">A clearly labeled concept screen showing a synthetic owner statement, device entry, context, and missing maintenance history with separate source labels.</desc>
  <rect width="1440" height="1024" fill="#EAF2F8"/><rect width="1440" height="92" fill="#07111F"/>
  <text x="64" y="58" fill="#EDF5FF" font-family="Inter,Arial,sans-serif" font-size="38" font-weight="850">Drivable</text><text x="242" y="58" fill="#9CB0C8" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="750" letter-spacing="3">BY MECHANIC'S EYE</text>
  <rect x="888" y="24" width="488" height="44" rx="22" fill="#3B1822" stroke="#FF8F8F"/><text x="1132" y="53" text-anchor="middle" fill="#FFD7D7" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="850" letter-spacing=".5">SYNTHETIC DEMONSTRATION · NOT A REAL RESULT</text>
  <text x="64" y="160" fill="#172334" font-family="Inter,Arial,sans-serif" font-size="46" font-weight="850">Evidence record</text><text x="64" y="205" fill="#52677F" font-family="Inter,Arial,sans-serif" font-size="24">Demo Sedan 01 · 2016 compact gasoline sedan · 112,400 miles</text>
  <rect x="64" y="252" width="1312" height="178" rx="24" fill="#FFFFFF" stroke="#C9D6E4" stroke-width="2"/><rect x="88" y="276" width="170" height="38" rx="19" fill="#FFF2D1"/><text x="173" y="301" text-anchor="middle" fill="#604713" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="850">OWNER STATED</text><text x="88" y="355" fill="#172334" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700">“The engine sometimes feels uneven for about twenty seconds after a cold start.</text><text x="88" y="393" fill="#172334" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700">I noticed it twice this week. I do not know the cause.”</text>
  <rect x="64" y="458" width="628" height="204" rx="24" fill="#FFFFFF" stroke="#C9D6E4" stroke-width="2"/><rect x="88" y="482" width="210" height="38" rx="19" fill="#D7F7FF"/><text x="193" y="507" text-anchor="middle" fill="#0B5269" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="850">DEVICE-REPORTED ENTRY</text><text x="88" y="566" fill="#172334" font-family="Inter,Arial,sans-serif" font-size="31" font-weight="850">P0301</text><text x="206" y="566" fill="#172334" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700">Cylinder 1 Misfire Detected</text><text x="88" y="612" fill="#52677F" font-family="Inter,Arial,sans-serif" font-size="20">A code reports a detected condition. It does not identify</text><text x="88" y="640" fill="#52677F" font-family="Inter,Arial,sans-serif" font-size="20">the failed part or prove a repair.</text>
  <rect x="720" y="458" width="656" height="204" rx="24" fill="#FFFFFF" stroke="#C9D6E4" stroke-width="2"/><rect x="744" y="482" width="170" height="38" rx="19" fill="#FFF2D1"/><text x="829" y="507" text-anchor="middle" fill="#604713" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="850">OWNER STATED</text><text x="744" y="566" fill="#172334" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="800">Fuel purchased two days earlier</text><text x="744" y="612" fill="#52677F" font-family="Inter,Arial,sans-serif" font-size="20">Timing is context—not evidence that the fuel caused</text><text x="744" y="640" fill="#52677F" font-family="Inter,Arial,sans-serif" font-size="20">the reported condition.</text>
  <rect x="64" y="690" width="1312" height="142" rx="24" fill="#FFF6F6" stroke="#F2B8B8" stroke-width="2"/><rect x="88" y="708" width="128" height="34" rx="17" fill="#FFD7D7"/><text x="152" y="731" text-anchor="middle" fill="#6D2424" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="850">MISSING</text><text x="88" y="779" fill="#172334" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="800">Maintenance history and freeze-frame data were not provided.</text><text x="88" y="812" fill="#52677F" font-family="Inter,Arial,sans-serif" font-size="19">Missing evidence lowers confidence.</text>
  <text x="64" y="910" fill="#52677F" font-family="Inter,Arial,sans-serif" font-size="20">Concept gallery · target product behavior, not a capture of the current live application</text><text x="64" y="954" fill="#52677F" font-family="Inter,Arial,sans-serif" font-size="18">No photo, audio, video, vision, document, or vibration analysis is represented.</text>
</svg>
