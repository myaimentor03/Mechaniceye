<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024" role="img" aria-labelledby="title desc">
  <title id="title">Synthetic Drivable possible causes concept</title><desc id="desc">A clearly labeled concept screen showing three bounded possible causes with confidence, support, conflict, missing evidence, and next questions.</desc>
  <rect width="1440" height="1024" fill="#EAF2F8"/><rect width="1440" height="92" fill="#07111F"/><text x="64" y="58" fill="#EDF5FF" font-family="Inter,Arial,sans-serif" font-size="38" font-weight="850">Drivable</text><rect x="888" y="24" width="488" height="44" rx="22" fill="#3B1822" stroke="#FF8F8F"/><text x="1132" y="53" text-anchor="middle" fill="#FFD7D7" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="850" letter-spacing=".5">SYNTHETIC DEMONSTRATION · NOT A REAL RESULT</text>
  <text x="64" y="154" fill="#172334" font-family="Inter,Arial,sans-serif" font-size="42" font-weight="850">Possible causes supported by current evidence</text><text x="64" y="198" fill="#52677F" font-family="Inter,Arial,sans-serif" font-size="23">A ranked possibility is not a confirmed diagnosis.</text>
  <g transform="translate(64 236)"><rect width="1312" height="194" rx="24" fill="#FFFFFF" stroke="#C9D6E4" stroke-width="2"/><circle cx="50" cy="48" r="24" fill="#3BD6FF"/><text x="50" y="56" text-anchor="middle" fill="#07111F" font-family="Arial" font-size="21" font-weight="900">1</text><text x="94" y="52" fill="#172334" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="850">Ignition-related misfire at cylinder 1</text><rect x="1048" y="25" width="224" height="48" rx="24" fill="#FFF2D1"/><text x="1160" y="56" text-anchor="middle" fill="#604713" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="850">MODERATE</text><text x="32" y="105" fill="#52677F" font-family="Inter,Arial,sans-serif" font-size="19"><tspan font-weight="800" fill="#172334">Support:</tspan> P0301 entry + owner-stated brief uneven cold start</text><text x="32" y="138" fill="#52677F" font-family="Inter,Arial,sans-serif" font-size="19"><tspan font-weight="800" fill="#172334">Missing/conflict:</tspan> no component test, maintenance history, freeze-frame, or physical inspection</text><text x="32" y="171" fill="#0B5269" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="750">Ask what test would distinguish coil, plug, wiring, injector, compression, or another cause.</text></g>
  <g transform="translate(64 454)"><rect width="1312" height="174" rx="24" fill="#FFFFFF" stroke="#C9D6E4" stroke-width="2"/><circle cx="50" cy="48" r="24" fill="#79E9FF"/><text x="50" y="56" text-anchor="middle" fill="#07111F" font-family="Arial" font-size="21" font-weight="900">2</text><text x="94" y="52" fill="#172334" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="850">Fuel-delivery issue affecting cylinder 1</text><rect x="1108" y="25" width="164" height="48" rx="24" fill="#E7EDF3"/><text x="1190" y="56" text-anchor="middle" fill="#3A4D61" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="850">LOW</text><text x="32" y="106" fill="#52677F" font-family="Inter,Arial,sans-serif" font-size="19"><tspan font-weight="800" fill="#172334">Support:</tspan> cylinder-specific code; owner reported recent fuel purchase</text><text x="32" y="141" fill="#52677F" font-family="Inter,Arial,sans-serif" font-size="19"><tspan font-weight="800" fill="#172334">Missing/conflict:</tspan> timing is not causation; no injector, pressure, trim, or fuel-quality evidence</text></g>
  <g transform="translate(64 652)"><rect width="1312" height="174" rx="24" fill="#FFFFFF" stroke="#C9D6E4" stroke-width="2"/><circle cx="50" cy="48" r="24" fill="#FFD27D"/><text x="50" y="56" text-anchor="middle" fill="#07111F" font-family="Arial" font-size="21" font-weight="900">3</text><text x="94" y="52" fill="#172334" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="850">Mechanical condition affecting cylinder 1</text><rect x="1108" y="25" width="164" height="48" rx="24" fill="#E7EDF3"/><text x="1190" y="56" text-anchor="middle" fill="#3A4D61" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="850">LOW</text><text x="32" y="106" fill="#52677F" font-family="Inter,Arial,sans-serif" font-size="19"><tspan font-weight="800" fill="#172334">Support:</tspan> a cylinder-specific misfire can have a mechanical cause</text><text x="32" y="141" fill="#52677F" font-family="Inter,Arial,sans-serif" font-size="19"><tspan font-weight="800" fill="#172334">Missing/conflict:</tspan> no compression, leak-down, physical, or qualified mechanical test</text></g>
  <rect x="64" y="858" width="1312" height="105" rx="20" fill="#11283B"/><text x="88" y="898" fill="#EDF5FF" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="800">Safety boundary</text><text x="88" y="934" fill="#B8C9DA" font-family="Inter,Arial,sans-serif" font-size="18">Not a confirmed diagnosis, repair instruction, inspection, emergency service, or determination that the vehicle is safe to drive.</text>
</svg>
