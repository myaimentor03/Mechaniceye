<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024" role="img" aria-labelledby="title desc">
  <title id="title">Synthetic Buyer Check concept</title><desc id="desc">A clearly labeled Buyer Check concept separating a seller statement, supporting submitted records, unknown current condition, and buyer next step.</desc>
  <rect width="1440" height="1024" fill="#EAF2F8"/><rect width="1440" height="92" fill="#07111F"/><text x="64" y="58" fill="#EDF5FF" font-family="Inter,Arial,sans-serif" font-size="38" font-weight="850">Drivable</text><text x="242" y="58" fill="#9CB0C8" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="750" letter-spacing="3">BUYER CHECK</text><rect x="888" y="24" width="488" height="44" rx="22" fill="#3B1822" stroke="#FF8F8F"/><text x="1132" y="53" text-anchor="middle" fill="#FFD7D7" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="850" letter-spacing=".5">SYNTHETIC DEMONSTRATION · NOT A REAL RESULT</text>
  <text x="64" y="154" fill="#172334" font-family="Inter,Arial,sans-serif" font-size="44" font-weight="850">What is supported—and what is still unknown</text><text x="64" y="198" fill="#52677F" font-family="Inter,Arial,sans-serif" font-size="23">Demo Sedan 01 · seller-authorized reuse demonstration</text>
  <rect x="64" y="238" width="1312" height="152" rx="24" fill="#FFF9EA" stroke="#E5C46D" stroke-width="2"/><rect x="88" y="262" width="194" height="38" rx="19" fill="#FFD27D"/><text x="185" y="287" text-anchor="middle" fill="#604713" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="850">SELLER-REPORTED</text><text x="88" y="344" fill="#172334" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="750">Seller states an intermittent cylinder 1 misfire was investigated and an ignition coil was replaced.</text>
  <rect x="64" y="418" width="632" height="194" rx="24" fill="#FFFFFF" stroke="#C9D6E4" stroke-width="2"/><rect x="88" y="442" width="228" height="38" rx="19" fill="#D7F7FF"/><text x="202" y="467" text-anchor="middle" fill="#0B5269" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="850">SUBMITTED RECORD</text><text x="88" y="526" fill="#172334" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="850">Synthetic P0301 entry exists</text><text x="88" y="565" fill="#52677F" font-family="Inter,Arial,sans-serif" font-size="19">Device entry reports a detected condition.</text><text x="88" y="593" fill="#52677F" font-family="Inter,Arial,sans-serif" font-size="19">It does not verify the seller's full statement.</text>
  <rect x="724" y="418" width="652" height="194" rx="24" fill="#FFFFFF" stroke="#C9D6E4" stroke-width="2"/><rect x="748" y="442" width="252" height="38" rx="19" fill="#E8F6EF"/><text x="874" y="467" text-anchor="middle" fill="#24583F" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="850">PROFESSIONAL REPORTED</text><text x="748" y="526" fill="#172334" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="850">Synthetic technician note supplied</text><text x="748" y="565" fill="#52677F" font-family="Inter,Arial,sans-serif" font-size="19">Describes a coil-swap test and replacement.</text><text x="748" y="593" fill="#52677F" font-family="Inter,Arial,sans-serif" font-size="19">Drivable did not independently verify it.</text>
  <rect x="64" y="640" width="632" height="174" rx="24" fill="#FFF6F6" stroke="#F2B8B8" stroke-width="2"/><rect x="88" y="664" width="128" height="38" rx="19" fill="#FFD7D7"/><text x="152" y="689" text-anchor="middle" fill="#6D2424" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="850">UNKNOWN</text><text x="88" y="748" fill="#172334" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="850">Current vehicle condition</text><text x="88" y="784" fill="#52677F" font-family="Inter,Arial,sans-serif" font-size="19">No current independent inspection was supplied.</text>
  <rect x="724" y="640" width="652" height="174" rx="24" fill="#11283B"/><text x="748" y="689" fill="#79E9FF" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="850">BUYER NEXT STEP</text><text x="748" y="748" fill="#EDF5FF" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="800">Request current service documentation</text><text x="748" y="784" fill="#EDF5FF" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="800">and an independent pre-purchase inspection.</text>
  <text x="64" y="890" fill="#52677F" font-family="Inter,Arial,sans-serif" font-size="19">AI-generated demonstration text keeps seller claims attributed. It does not say “problem fixed,” “verified repair,” or “mechanically sound.”</text><text x="64" y="942" fill="#52677F" font-family="Inter,Arial,sans-serif" font-size="18">Not a real listing, inspection, title report, condition report, or transaction.</text>
</svg>
