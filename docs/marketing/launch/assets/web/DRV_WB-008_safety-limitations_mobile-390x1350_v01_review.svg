<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1350" viewBox="0 0 390 1350" role="img" aria-labelledby="title desc">
  <title id="title">Drivable safety and limitations mobile explainer</title><desc id="desc">A mobile concept prioritizing immediate danger escalation, parked-only evidence collection, and Drivable's boundaries.</desc>
  <rect width="390" height="1350" fill="#EAF2F8"/><rect width="390" height="78" fill="#07111F"/><text x="22" y="36" fill="#EDF5FF" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="850">Drivable</text><text x="22" y="59" fill="#9CB0C8" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="750" letter-spacing="2">SAFETY &amp; LIMITATIONS</text><rect x="274" y="22" width="94" height="34" rx="17" fill="#143246" stroke="#3BD6FF"/><text x="321" y="43" text-anchor="middle" fill="#BCEFFF" font-family="Inter,Arial,sans-serif" font-size="9" font-weight="850">CONCEPT</text>
  <text x="22" y="124" fill="#172334" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="850">Safety comes before</text><text x="22" y="158" fill="#172334" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="850">evidence collection.</text><text x="22" y="192" fill="#52677F" font-family="Inter,Arial,sans-serif" font-size="13">Do not take a risk, recreate a symptom, or wait</text><text x="22" y="212" fill="#52677F" font-family="Inter,Arial,sans-serif" font-size="13">for a result when appropriate help may be needed.</text>
  <g transform="translate(22 244)" font-family="Inter,Arial,sans-serif"><rect width="346" height="336" rx="20" fill="#FFF6F6" stroke="#FF8F8F" stroke-width="2"/><circle cx="38" cy="42" r="20" fill="#FF8F8F"/><text x="38" y="50" text-anchor="middle" fill="#3B1822" font-size="21" font-weight="900">!</text><text x="68" y="47" fill="#6D2424" font-size="14" font-weight="900">POSSIBLE IMMEDIATE THREAT</text><text x="20" y="84" fill="#172334" font-size="13" font-weight="750">Stop using the vehicle and seek appropriate</text><text x="20" y="104" fill="#172334" font-size="13" font-weight="750">qualified or emergency help for signs such as:</text><text x="20" y="141" fill="#52677F" font-size="12">• fire, smoke, fuel odor, or a leak;</text><text x="20" y="171" fill="#52677F" font-size="12">• severe overheating or electrical hazard;</text><text x="20" y="201" fill="#52677F" font-size="12">• loss of braking, steering, or power in traffic;</text><text x="20" y="231" fill="#52677F" font-size="12">• wheel/tire structural risk or severe instability.</text><text x="20" y="271" fill="#52677F" font-size="11">Contact emergency services or a qualified professional</text><text x="20" y="289" fill="#52677F" font-size="11">as appropriate. This list is not exhaustive.</text><text x="20" y="320" fill="#6D2424" font-size="11" font-weight="850">DO NOT WAIT FOR DRIVABLE IN AN EMERGENCY.</text></g>
  <g transform="translate(22 606)" font-family="Inter,Arial,sans-serif"><rect width="346" height="282" rx="20" fill="#11283B"/><text x="20" y="40" fill="#79E9FF" font-size="13.5" font-weight="900">COLLECT ONLY WHEN SAFELY PARKED</text><text x="20" y="82" fill="#EDF5FF" font-size="12">• Never type, record, photograph, or connect</text><text x="34" y="102" fill="#EDF5FF" font-size="12">equipment while driving.</text><text x="20" y="139" fill="#EDF5FF" font-size="12">• Do not recreate a symptom for content.</text><text x="20" y="176" fill="#EDF5FF" font-size="12">• Do not approach moving, hot, energized,</text><text x="34" y="196" fill="#EDF5FF" font-size="12">pressurized, or unsupported components.</text><text x="20" y="240" fill="#B8C9DA" font-size="11">“I cannot provide this safely” is an acceptable</text><text x="20" y="258" fill="#B8C9DA" font-size="11">evidence response.</text></g>
  <g transform="translate(22 914)" font-family="Inter,Arial,sans-serif"><rect width="346" height="266" rx="20" fill="#FFFFFF" stroke="#C9D6E4" stroke-width="2"/><text x="20" y="40" fill="#172334" font-size="15" font-weight="900">DRIVABLE DOES NOT</text><text x="20" y="82" fill="#52677F" font-size="12">• provide emergency service or real-time monitoring;</text><text x="20" y="119" fill="#52677F" font-size="12">• replace a physical inspection or qualified diagnosis;</text><text x="20" y="156" fill="#52677F" font-size="12">• declare a vehicle safe, roadworthy, or repaired.</text><text x="20" y="202" fill="#52677F" font-size="11">Possible causes and confidence labels never override</text><text x="20" y="220" fill="#52677F" font-size="11">warning signs, professional advice, or your judgment.</text></g>
  <rect x="22" y="1206" width="346" height="108" rx="18" fill="#0B344B"/><text x="195" y="1235" text-anchor="middle" fill="#FFFFFF" font-family="Inter,Arial,sans-serif" font-size="9" font-weight="900">STOP COLLECTION WHEN CONDITIONS MAY BE DANGEROUS</text><text x="195" y="1262" text-anchor="middle" fill="#B8C9DA" font-family="Inter,Arial,sans-serif" font-size="10">Seek appropriate qualified or emergency help.</text><text x="195" y="1291" text-anchor="middle" fill="#B8C9DA" font-family="Inter,Arial,sans-serif" font-size="9">Target messaging concept—not current product UI.</text>
</svg>
