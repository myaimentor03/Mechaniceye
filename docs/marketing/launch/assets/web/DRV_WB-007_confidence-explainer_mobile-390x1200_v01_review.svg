<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1200" viewBox="0 0 390 1200" role="img" aria-labelledby="title desc">
  <title id="title">Drivable How Confidence Works mobile explainer</title><desc id="desc">A mobile concept explaining confidence as evidence support, with low, moderate, higher, unable-to-rank, and safety-boundary sections.</desc>
  <rect width="390" height="1200" fill="#EAF2F8"/><rect width="390" height="78" fill="#07111F"/><text x="22" y="36" fill="#EDF5FF" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="850">Drivable</text><text x="22" y="59" fill="#9CB0C8" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="750" letter-spacing="2">HOW CONFIDENCE WORKS</text><rect x="274" y="22" width="94" height="34" rx="17" fill="#143246" stroke="#3BD6FF"/><text x="321" y="43" text-anchor="middle" fill="#BCEFFF" font-family="Inter,Arial,sans-serif" font-size="9" font-weight="850">CONCEPT</text>
  <text x="22" y="124" fill="#172334" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="850">Confidence describes</text><text x="22" y="158" fill="#172334" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="850">evidence support.</text><text x="22" y="192" fill="#52677F" font-family="Inter,Arial,sans-serif" font-size="14">Not certainty, urgency, severity, diagnosis,</text><text x="22" y="213" fill="#52677F" font-family="Inter,Arial,sans-serif" font-size="14">or a vehicle-safety rating.</text>
  <g transform="translate(22 248)" font-family="Inter,Arial,sans-serif"><rect width="346" height="280" rx="20" fill="#FFFFFF" stroke="#C9D6E4" stroke-width="2"/><text x="20" y="38" fill="#172334" font-size="15" font-weight="850">EVIDENCE SUPPORT</text><path d="M55 86V225" stroke="#C9D6E4" stroke-width="8" stroke-linecap="round"/><path d="M55 225V132" stroke="#3BD6FF" stroke-width="8" stroke-linecap="round"/><circle cx="55" cy="225" r="13" fill="#FFD27D"/><circle cx="55" cy="178" r="13" fill="#3BD6FF"/><circle cx="55" cy="132" r="13" fill="#9AF0C5"/><text x="88" y="137" fill="#172334" font-size="14" font-weight="850">HIGHER</text><text x="88" y="155" fill="#52677F" font-size="11">Several relevant signals align.</text><text x="88" y="183" fill="#172334" font-size="14" font-weight="850">MODERATE</text><text x="88" y="201" fill="#52677F" font-size="11">Missing evidence could change the rank.</text><text x="88" y="230" fill="#172334" font-size="14" font-weight="850">LOW</text><text x="88" y="248" fill="#52677F" font-size="11">Weak support; more evidence may be needed.</text><text x="20" y="270" fill="#52677F" font-size="10">No label is a promise or probability.</text></g>
  <g transform="translate(22 552)" font-family="Inter,Arial,sans-serif"><rect width="346" height="218" rx="20" fill="#11283B"/><text x="20" y="39" fill="#79E9FF" font-size="15" font-weight="850">UNABLE TO RANK RESPONSIBLY</text><text x="20" y="76" fill="#EDF5FF" font-size="14" font-weight="750">Evidence may be:</text><circle cx="28" cy="107" r="5" fill="#FFD27D"/><text x="43" y="112" fill="#B8C9DA" font-size="12">too limited or conflicting;</text><circle cx="28" cy="137" r="5" fill="#FFD27D"/><text x="43" y="142" fill="#B8C9DA" font-size="12">unsafe to collect;</text><circle cx="28" cy="167" r="5" fill="#FFD27D"/><text x="43" y="172" fill="#B8C9DA" font-size="12">outside the workflow's scope.</text><text x="20" y="202" fill="#B8C9DA" font-size="11">Do not manufacture certainty.</text></g>
  <g transform="translate(22 794)" font-family="Inter,Arial,sans-serif"><rect width="346" height="234" rx="20" fill="#FFF6F6" stroke="#F2B8B8" stroke-width="2"/><text x="20" y="39" fill="#6D2424" font-size="15" font-weight="850">SAFETY IS SEPARATE</text><text x="20" y="77" fill="#172334" font-size="14" font-weight="750">Confidence does not answer:</text><text x="20" y="111" fill="#52677F" font-size="12">• Is the vehicle safe to drive?</text><text x="20" y="141" fill="#52677F" font-size="12">• How urgent or severe is the condition?</text><text x="20" y="171" fill="#52677F" font-size="12">• Is emergency or hands-on help needed?</text><text x="20" y="211" fill="#52677F" font-size="11">Use separate safety and escalation rules.</text></g>
  <rect x="22" y="1052" width="346" height="104" rx="18" fill="#0B344B"/><text x="195" y="1082" text-anchor="middle" fill="#FFFFFF" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="900">POSSIBLE CAUSE ≠ CONFIRMED DIAGNOSIS</text><text x="195" y="1106" text-anchor="middle" fill="#B8C9DA" font-family="Inter,Arial,sans-serif" font-size="10">Not a safety determination.</text><text x="195" y="1134" text-anchor="middle" fill="#B8C9DA" font-family="Inter,Arial,sans-serif" font-size="9">Target messaging concept—not current product UI.</text>
</svg>
