<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Drivable — evidence before certainty</title>
  <desc id="desc">A landscape sharing image with the Drivable brand and evidence-first launch message.</desc>
  <rect width="1200" height="630" fill="#07111F"/>
  <circle cx="1115" cy="72" r="260" fill="#0D1A2B"/>
  <circle cx="1115" cy="72" r="165" fill="none" stroke="#223854" stroke-width="2"/>
  <circle cx="1115" cy="72" r="86" fill="none" stroke="#3BD6FF" stroke-width="5"/>
  <path d="M1000 170 L1070 240 L1190 118" fill="none" stroke="#3BD6FF" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  <g font-family="Inter,Arial,sans-serif">
    <text x="76" y="102" font-size="50" font-weight="800" fill="#EDF5FF">drivable</text>
    <text x="300" y="102" font-size="23" fill="#9CB0C8">by Mechanic's Eye</text>
    <text x="76" y="272" font-size="72" font-weight="800" fill="#EDF5FF">Evidence before certainty.</text>
    <text x="76" y="342" font-size="30" fill="#9CB0C8">Better vehicle questions begin with what changed,</text>
    <text x="76" y="384" font-size="30" fill="#9CB0C8">what supports it, and what is still unknown.</text>
    <rect x="76" y="462" width="374" height="62" rx="31" fill="#3BD6FF"/>
    <text x="263" y="502" font-size="20" font-weight="800" text-anchor="middle" letter-spacing="0.4" fill="#07111F">CLOSED BETA IN PREPARATION</text>
    <text x="76" y="580" font-size="21" fill="#9CB0C8">Possible causes are not a confirmed diagnosis or safety determination.</text>
  </g>
</svg>
