<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Drivable How Confidence Works desktop explainer</title><desc id="desc">A desktop concept explaining confidence as evidence support, separating it from urgency, severity, diagnosis, and safety, and showing an unable-to-rank state.</desc>
  <rect width="1440" height="900" fill="#EAF2F8"/><rect width="1440" height="82" fill="#07111F"/><text x="62" y="53" fill="#EDF5FF" font-family="Inter,Arial,sans-serif" font-size="35" font-weight="850">Drivable</text><text x="232" y="53" fill="#9CB0C8" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="750" letter-spacing="3">HOW CONFIDENCE WORKS</text><rect x="1160" y="21" width="216" height="42" rx="21" fill="#143246" stroke="#3BD6FF"/><text x="1268" y="49" text-anchor="middle" fill="#BCEFFF" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="850">CONCEPT REVIEW</text>
  <text x="62" y="151" fill="#172334" font-family="Inter,Arial,sans-serif" font-size="43" font-weight="850">Confidence describes evidence support.</text><text x="62" y="193" fill="#52677F" font-family="Inter,Arial,sans-serif" font-size="22">It is not certainty, urgency, severity, diagnosis, or a vehicle-safety rating.</text>
  <g transform="translate(62 245)" font-family="Inter,Arial,sans-serif"><rect width="1316" height="246" rx="26" fill="#FFFFFF" stroke="#C9D6E4" stroke-width="2"/><text x="30" y="48" fill="#172334" font-size="22" font-weight="850">AVAILABLE EVIDENCE SUPPORT</text><path d="M70 116H1246" stroke="#C9D6E4" stroke-width="12" stroke-linecap="round"/><path d="M70 116H852" stroke="#3BD6FF" stroke-width="12" stroke-linecap="round"/><circle cx="70" cy="116" r="20" fill="#FFD27D"/><circle cx="460" cy="116" r="20" fill="#3BD6FF"/><circle cx="852" cy="116" r="20" fill="#9AF0C5"/><text x="70" y="169" text-anchor="middle" fill="#172334" font-size="19" font-weight="850">LOW</text><text x="460" y="169" text-anchor="middle" fill="#172334" font-size="19" font-weight="850">MODERATE</text><text x="852" y="169" text-anchor="middle" fill="#172334" font-size="19" font-weight="850">HIGHER</text><text x="1246" y="169" text-anchor="middle" fill="#52677F" font-size="19" font-weight="850">NOT A PROMISE</text><text x="30" y="218" fill="#52677F" font-size="18">Support can change when relevant evidence is added, corrected, removed, or found to conflict.</text></g>
  <g transform="translate(62 521)" font-family="Inter,Arial,sans-serif"><rect width="630" height="222" rx="26" fill="#11283B"/><text x="30" y="49" fill="#79E9FF" font-size="21" font-weight="850">UNABLE TO RANK RESPONSIBLY</text><text x="30" y="94" fill="#EDF5FF" font-size="22" font-weight="750">The evidence may be:</text><circle cx="42" cy="133" r="6" fill="#FFD27D"/><text x="62" y="140" fill="#B8C9DA" font-size="18">too limited or materially conflicting;</text><circle cx="42" cy="169" r="6" fill="#FFD27D"/><text x="62" y="176" fill="#B8C9DA" font-size="18">unsafe to collect or outside the workflow's scope.</text><text x="30" y="207" fill="#B8C9DA" font-size="16">Do not manufacture a list to appear certain.</text></g>
  <g transform="translate(722 521)" font-family="Inter,Arial,sans-serif"><rect width="656" height="222" rx="26" fill="#FFF6F6" stroke="#F2B8B8" stroke-width="2"/><text x="30" y="49" fill="#6D2424" font-size="21" font-weight="850">SEPARATE SAFETY AND ESCALATION</text><text x="30" y="94" fill="#172334" font-size="22" font-weight="750">A confidence label never answers:</text><text x="30" y="136" fill="#52677F" font-size="18">Is this safe to drive? How urgent or severe is it?</text><text x="30" y="172" fill="#52677F" font-size="18">Does this require emergency, human, or hands-on help?</text><text x="30" y="207" fill="#52677F" font-size="16">Those decisions require separate rules and evidence.</text></g>
  <rect x="62" y="774" width="1316" height="76" rx="20" fill="#0B344B"/><text x="720" y="806" text-anchor="middle" fill="#FFFFFF" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="900">POSSIBLE CAUSES ARE NOT A CONFIRMED DIAGNOSIS OR SAFETY DETERMINATION</text><text x="720" y="833" text-anchor="middle" fill="#B8C9DA" font-family="Inter,Arial,sans-serif" font-size="16">Target messaging concept—not a capture of the current live application.</text>
</svg>
