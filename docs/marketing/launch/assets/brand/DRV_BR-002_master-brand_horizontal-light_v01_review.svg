<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="400" viewBox="0 0 1600 400" role="img" aria-labelledby="title desc">
  <title id="title">Drivable by Mechanic's Eye provisional horizontal light lockup</title>
  <desc id="desc">A dark and cyan evidence-path symbol beside the word Drivable with the endorsement by Mechanic's Eye on a light background.</desc>
  <defs>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#087C9A"/>
      <stop offset="1" stop-color="#0C9FC4"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="400" rx="40" fill="#F7F9FB"/>
  <g transform="translate(92 70)">
    <rect x="0" y="0" width="260" height="260" rx="64" fill="#FFFFFF" stroke="#CAD4DF" stroke-width="8"/>
    <path d="M70 64H128C181 64 214 94 214 130C214 166 181 196 128 196H70Z" fill="none" stroke="url(#signal)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M70 130H151" fill="none" stroke="#172334" stroke-width="18" stroke-linecap="round"/>
    <circle cx="70" cy="64" r="13" fill="#2B8C63"/>
    <circle cx="214" cy="130" r="13" fill="#C4810D"/>
    <circle cx="70" cy="196" r="13" fill="#0C9FC4"/>
  </g>
  <g font-family="Inter, Arial, Helvetica, sans-serif">
    <text x="410" y="223" fill="#172334" font-size="150" font-weight="800" letter-spacing="-6">Drivable</text>
    <line x1="421" y1="259" x2="1180" y2="259" stroke="#CAD4DF" stroke-width="4"/>
    <text x="422" y="316" fill="#52657A" font-size="38" font-weight="650" letter-spacing="7">BY MECHANIC'S EYE</text>
  </g>
</svg>
