  <rect width="2560" height="1440" fill="url(#bg)"/><circle cx="1900" cy="280" r="760" fill="url(#glow)"/>
  <path d="M0 1130 C420 980 720 1280 1230 1050 S2010 740 2560 910" fill="none" stroke="#3BD6FF" stroke-width="5" opacity=".45"/>
  <circle cx="830" cy="1135" r="14" fill="#FFD27D"/><circle cx="1370" cy="991" r="14" fill="#3BD6FF"/><circle cx="1940" cy="816" r="14" fill="#79E9FF"/>
