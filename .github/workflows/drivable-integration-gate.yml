name: Drivable Integration Gate

on:
  push:
    branches:
      - integration/drivable-beta-0902
      - candidate/**
  workflow_dispatch:

concurrency:
  group: drivable-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run check

      - name: Production build
        run: npm run build

      - name: Evidence tests
        run: npm run test:evidence

      - name: Authentication tests
        run: npm run test:auth

      - name: Case identity tests
        run: npm run test:identity

      - name: Security tests
        run: npm run test:security

      - name: Safe contract test suite
        run: npm run test:safe-contracts

      - name: Whitespace / conflict-marker check
        run: git diff --check HEAD^ HEAD
